<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=50">
<title>ARVEN 320x50 &mdash; Flex Saver</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:320px;height:50px;overflow:hidden;background:#F6F4EE;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:320px;height:50px;overflow:hidden;cursor:pointer;
  background:#F6F4EE;color:#1E2A2B;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}


.lg{display:flex;align-items:center;gap:3.5999999999999996px;white-space:nowrap}
.lg b{font-size:12px;font-weight:800;letter-spacing:.6px;color:#1E2A2B}
.lg i{width:6px;height:6px;border-radius:2px;background:#0F7B6C;transform:rotate(45deg);display:block}

.cta{display:inline-block;background:#0F7B6C;color:#fff;border:0;border-radius:4px;cursor:pointer;
  font:700 8.5px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:8px 12px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#1E2A2B}

.eb{font-size:8px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:#6E7A78}
h1{font-weight:700;letter-spacing:-.5px;line-height:1.08;color:#1E2A2B}
.num{font:600 1em ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums;color:#1E2A2B;letter-spacing:-.5px}
.num.v{color:#0F7B6C}
.lab{font-size:8px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#6E7A78}
.cum{color:#6E7A78;line-height:1.4}
.var{font-size:7.5px;color:#6E7A78;line-height:1.35}

.K{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 10px}
.tx{flex:1;min-width:0}
.t1{font-size:9.5px;font-weight:700;white-space:nowrap;letter-spacing:-.2px}
.t1 .num{font-size:10px}
.t2{font-size:7.5px;color:#6E7A78;white-space:nowrap;margin-top:1px}
.cta{flex:none;pointer-events:auto}

.adv{position:absolute;left:10px;bottom:0px;
  font-size:5.5px;font-weight:600;letter-spacing:1.2px;color:#6E7A78;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="K">
  <div class="lg"><b>ARVEN</b><i></i></div>
  <div class="tx">
    <div class="t1"><span class="num" id="AYL"></span>/mo becomes <span class="num v" id="TOP"></span> in 5 years</div>
    <div class="t2">Flex Saver, 4.1 % a year, paid monthly. Illustrative.</div>
  </div>
  <button class="cta" data-cta="1">Open now</button>
</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "../../landing.html?b=arven-flex-saver";

var PARA = 50, ORAN = 0.041, AY = 60, ADET = 10;
function gelecek(k) {
  var m = k * PARA, r = ORAN / 12;
  var fv = m * (Math.pow(1 + r, AY) - 1) / r;
  return { aylik: m, toplam: Math.round(fv), yatan: m * AY, faiz: Math.round(fv - m * AY) };
}
function para(v) { return "\u20AC" + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

var AYL = document.getElementById("AYL"), TOP = document.getElementById("TOP");
var k = 0, yon = 1, sonT = 0, dokunuldu = false;
function ciz() { var g = gelecek(k); AYL.textContent = para(g.aylik); TOP.textContent = para(g.toplam); }
function ayarla(v) { dokunuldu = true; k = v; ciz(); }
function dongu(z) {
  if (!dokunuldu) {
    if (!sonT) sonT = z;
    if (z - sonT > 650) { sonT = z; k += yon; if (k >= 8) { k = 8; yon = -1; } else if (k <= 1) { k = 1; yon = 1; } ciz(); }
  }
  requestAnimationFrame(dongu);
}
k = 1; ciz(); requestAnimationFrame(dongu);
/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
