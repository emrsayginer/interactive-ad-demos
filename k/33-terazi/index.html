<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=970,height=250">
<title>ARVEN 970x250 &mdash; Flex Saver</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:970px;height:250px;overflow:hidden;background:#F6F4EE;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;
  background:#F6F4EE;color:#1E2A2B;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}


.lg{display:flex;align-items:center;gap:4.8px;white-space:nowrap}
.lg b{font-size:16px;font-weight:800;letter-spacing:.6px;color:#1E2A2B}
.lg i{width:8px;height:8px;border-radius:2px;background:#0F7B6C;transform:rotate(45deg);display:block}

.cta{display:inline-block;background:#0F7B6C;color:#fff;border:0;border-radius:4px;cursor:pointer;
  font:700 10px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:11px 20px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#1E2A2B}

.tz{display:block;overflow:visible}
.tz .ayak{stroke:#DCD8CC;stroke-width:2;stroke-linecap:round}
.tz .kiris{stroke:#1E2A2B;stroke-width:2.4;stroke-linecap:round}
.tz .piv{fill:#1E2A2B}
.tz .ip{stroke:#6E7A78;stroke-width:.9}
.tz .kefe{fill:none;stroke:#1E2A2B;stroke-width:1.8}
.tz .et{font:600 6.5px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#6E7A78}
.tz .pr{cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.tz .pr circle{fill:#E4B75A;stroke:#B8892E;stroke-width:1}
.tz .pr .ic{fill:none;stroke:#B8892E;stroke-width:.7;opacity:.7}
.tz .pr:hover circle{fill:#F0C86E}
#KIRIS,#KL,#KR{transition:transform .45s cubic-bezier(.2,.8,.2,1)}

.eb{font-size:8px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:#6E7A78}
h1{font-weight:700;letter-spacing:-.5px;line-height:1.08;color:#1E2A2B}
.num{font:600 1em ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums;color:#1E2A2B;letter-spacing:-.5px}
.num.v{color:#0F7B6C}
.lab{font-size:8px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#6E7A78}
.cum{color:#6E7A78;line-height:1.4}
.var{font-size:7.5px;color:#6E7A78;line-height:1.35}

.L{position:absolute;left:36px;top:0;width:300px;height:100%;padding-bottom:20px;display:flex;flex-direction:column;
  justify-content:center;pointer-events:none}
.L .eb{margin-top:14px}
.L h1{margin-top:8px;font-size:25px}
.L .cum{margin-top:9px;font-size:12px;min-height:34px}
.L .cta{margin-top:10px;align-self:flex-start;pointer-events:auto}
.C{position:absolute;left:372px;top:26px}
.C .lab{position:absolute;left:0;right:0;top:-12px;text-align:center}
.Rt{position:absolute;left:716px;top:0;width:224px;height:100%;display:flex;flex-direction:column;justify-content:center;
  gap:10px;padding-bottom:16px;pointer-events:none}
.Rt .num{font-size:30px;line-height:1}
.Rt .num small{font-size:12px;color:#6E7A78;letter-spacing:0;font-weight:600}
.Rt .lab{margin-top:3px}
.Rt .var{margin-top:2px}
.vd{position:absolute;top:30px;bottom:30px;width:1px;background:#DCD8CC}

.adv{position:absolute;left:36px;bottom:4px;
  font-size:6.5px;font-weight:600;letter-spacing:1.2px;color:#6E7A78;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="L">
  <div class="lg"><b>ARVEN</b><i></i></div>
  <div class="eb">Flex Saver &middot; no lock-in</div>
  <h1>Move a coin.<br>See what five years does.</h1>
  <div class="cum" id="CUM"></div>
  <button class="cta" data-cta="1">Open in five minutes</button>
</div>
<div class="vd" style="left:352px"></div>
<div class="C"><div class="lab">Tap a coin &middot; each is &euro;50 a month</div><svg class="tz" viewBox="0 0 300 190" width="300" height="190">
  <line x1="150" y1="40" x2="150" y2="184" class="ayak"/>
  <line x1="85.1" y1="184" x2="214.9" y2="184" class="ayak"/>
  <g id="KIRIS" style="transform-origin:150px 40px"><line x1="32" y1="40" x2="268" y2="40" class="kiris"/></g>
  <circle cx="150" cy="40" r="4.8999999999999995" class="piv"/>
  <line id="IPL" class="ip"/><line id="IPR" class="ip"/>
  <g id="KL"><path d="M-46 0 Q0 22 46 0Z" class="kefe"/><text y="34" text-anchor="middle" class="et">SPEND NOW</text></g>
  <g id="KR"><path d="M-46 0 Q0 22 46 0Z" class="kefe"/><text y="34" text-anchor="middle" class="et">SAVE</text></g>
  <g id="PL"><g class="pr" data-i="0" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="1" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="2" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="3" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="4" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="5" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="6" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="7" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="8" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g><g class="pr" data-i="9" data-kontrol="1"><circle r="7"/><circle r="4.3" class="ic"/></g></g>
</svg></div>
<div class="vd" style="left:694px"></div>
<div class="Rt">
  <div><div class="num"><span id="AYL"></span> <small>/ month</small></div><div class="lab">Set aside</div></div>
  <div><div class="num v" id="TOP"></div><div class="lab">After five years</div></div>
  <div><div class="num"><span id="FAZ"></span></div><div class="lab">Of it, interest</div>
    <div class="var">4.1 % a year, paid monthly. Illustrative, not an offer.</div></div>
</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "../../landing.html?b=arven-flex-saver";

var PARA = 50, ORAN = 0.041, AY = 60, ADET = 10;
function gelecek(k) {
  var m = k * PARA, r = ORAN / 12;
  var fv = m * (Math.pow(1 + r, AY) - 1) / r;
  return { aylik: m, toplam: Math.round(fv), yatan: m * AY, faiz: Math.round(fv - m * AY) };
}
function para(v) { return "\u20AC" + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

var W = 300, CX = W / 2, CY = 40, L = 118, IP = 68, R = 7, KW = 92;
var KIRIS = document.getElementById("KIRIS"), KL = document.getElementById("KL"), KR = document.getElementById("KR"),
    IPL = document.getElementById("IPL"), IPR = document.getElementById("IPR");
var PR = Array.prototype.slice.call(document.querySelectorAll(".pr"));
var AYL = document.getElementById("AYL"), TOP = document.getElementById("TOP"), FAZ = document.getElementById("FAZ"),
    CUM = document.getElementById("CUM"), KN = document.getElementById("KN");
var sag = [], dokunuldu = false, sonT = 0, yon = 1, bekle = 0;
for (var i = 0; i < ADET; i++) sag.push(false);

function yigin(n, j) {   /* kefedeki j. paranin yeri: 5'li sira, ustuste */
  var sira = Math.floor(j / 5), s = j % 5, adet = Math.min(5, n - sira * 5);
  var x = (s - (adet - 1) / 2) * (R * 2 + 1.5);
  return { x: x, y: -R - sira * (R * 2 + 1) - 1 };
}
function ciz() {
  var k = 0; for (var i = 0; i < ADET; i++) if (sag[i]) k++;
  var a = (k - (ADET - k)) / ADET * 11, rad = a * Math.PI / 180;
  KIRIS.style.transform = "rotate(" + a + "deg)";
  var lx = CX - L * Math.cos(rad), ly = CY - L * Math.sin(rad);
  var rx = CX + L * Math.cos(rad), ry = CY + L * Math.sin(rad);
  KL.style.transform = "translate(" + lx + "px," + (ly + IP) + "px)";
  KR.style.transform = "translate(" + rx + "px," + (ry + IP) + "px)";
  IPL.setAttribute("x1", lx); IPL.setAttribute("y1", ly); IPL.setAttribute("x2", lx); IPL.setAttribute("y2", ly + IP);
  IPR.setAttribute("x1", rx); IPR.setAttribute("y1", ry); IPR.setAttribute("x2", rx); IPR.setAttribute("y2", ry + IP);
  var jl = 0, jr = 0;
  for (var i = 0; i < ADET; i++) {
    var p;
    if (sag[i]) { p = yigin(k, jr++); PR[i].style.transform = "translate(" + (rx + p.x) + "px," + (ry + IP + p.y) + "px)"; }
    else { p = yigin(ADET - k, jl++); PR[i].style.transform = "translate(" + (lx + p.x) + "px," + (ly + IP + p.y) + "px)"; }
  }
  var g = gelecek(k);
  if (KN) KN.textContent = k;
  if (AYL) AYL.textContent = para(g.aylik);
  if (TOP) TOP.textContent = para(g.toplam);
  if (FAZ) FAZ.textContent = para(g.faiz);
  if (CUM) CUM.textContent = k === 0 ? "Nothing saved, nothing grown. Move a coin across."
    : para(g.aylik) + " a month becomes " + para(g.toplam) + " in five years, " + para(g.faiz) + " of it interest.";
}
function ayarla(k) {
  dokunuldu = true;
  for (var i = 0; i < ADET; i++) sag[i] = i < k;
  ciz();
}
PR.forEach(function (p, i) {
  p.addEventListener("click", function (e) { e.stopPropagation(); dokunuldu = true; sag[i] = !sag[i]; ciz(); });
});
/* Dokunulana kadar: paralar 0->6 tek tek sag kefeye, kisa bekleme, geri. */
var k0 = 0;
function dongu(z) {
  if (!dokunuldu) {
    if (!sonT) sonT = z;
    if (z - sonT > 650) {
      sonT = z;
      if (bekle > 0) bekle--;
      else {
        k0 += yon;
        if (k0 >= 6) { k0 = 6; yon = -1; bekle = 2; } else if (k0 <= 0) { k0 = 0; yon = 1; bekle = 1; }
        for (var i = 0; i < ADET; i++) sag[i] = i < k0;
        ciz();
      }
    }
  }
  requestAnimationFrame(dongu);
}
ciz();
requestAnimationFrame(dongu);

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
