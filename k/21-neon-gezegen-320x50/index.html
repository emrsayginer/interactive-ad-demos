body{width:320px;height:50px;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
.b{position:relative;width:320px;height:50px;overflow:hidden;cursor:pointer;background:#05060E;

/* ---------------------------------------------------------------------------
   BU FORMATTA SECICI YOK.

   Alti gezegen 320x50'ye sigmaz: sembol satiri ile CTA yan yana konunca
   dokunma hedefleri 24 pikselin altina duser, yani parmakla isabet
   ettirilemez. Mekanigi zorla sokusturmak yerine format ne isteniyorsa onu
   yapiyor: marka, tek rakam, tek dugme.

   Tek sahne gomuluyor (--gezegen gorgon, lav dunyasi), alti degil: kullanilmayacak bes
   goruntuyu tasimanin anlami yok.
--------------------------------------------------------------------------- */
.S{position:absolute;inset:0;background-size:cover;background-position:center}
.S::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(5,6,14,.90) 0%,rgba(5,6,14,.60) 38%,
             rgba(5,6,14,.26) 58%,rgba(5,6,14,.80) 100%)}

.L{position:absolute;left:12px;top:0;height:100%;z-index:5;display:flex;
  flex-direction:column;justify-content:center;pointer-events:none}
.lg{font-size:12.5px;font-weight:800;letter-spacing:-.2px;line-height:1.05;white-space:nowrap}
.lg b{color:#fff;text-shadow:0 0 10px rgba(120,225,255,.55)}
.lg i{font-style:normal;color:#FF2E9A;text-shadow:0 0 12px rgba(255,46,154,.75)}
.st{margin-top:3px;font-size:7px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.55);white-space:nowrap}
.st em{font-style:normal;color:#22E0FF}

.cta{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:6;
  background:#22E0FF;color:#04212B;border:0;
  font:800 9px/1 -apple-system,'Segoe UI',Arial;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 15px;border-radius:999px;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 14px rgba(34,224,255,.45);transition:background .2s}
.cta:hover{background:#fff}

.adv{position:absolute;left:4px;bottom:2px;z-index:9;font-size:6px;font-weight:600;
  letter-spacing:1px;color:rgba(255,255,255,.22)}
@media(prefers-reduced-motion:reduce){.cta{transition:none}}
</style></head><body>
