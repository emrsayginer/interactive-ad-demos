<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=970,height=250">
<title>ORSA 970x250 &mdash; Black Friday phases</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{width:970px;height:250px;overflow:hidden;background:#fff;-webkit-font-smoothing:antialiased}

/* ---------------------------------------------------------------------------
   TIPOGRAFI

   Iki yigin var ve ikisi de SISTEM fontu -- gomulu font yok, harici istek yok.
     serif : basliklar, rakamlar, fiyatlar. Yuksek kontrastli moda serifi Mac'te
             Didot, Office kurulu Windows'ta Bodoni MT, aksi halde Georgia'ya
             duser. Ucu de bu tonu tasiyor.
     sans  : yalnizca kucuk etiketler ve arayuz.
   Fiyat rakamini serife tasimak, kreatifin tonunu tek basina degistiren sey.
--------------------------------------------------------------------------- */
.b{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;
  background:#F3F0EA;color:#17150F;
  font:400 13px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.sf{font-family:Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif}

/* Ayrac cizgiler. Once her sutun kendi dolgu rengindeydi; uc ayri zemin
   tonu banner'i bloklara boluyor ve ucuz gosteriyordu. Tek zemin + sac
   teli cizgi hem daha sakin hem daha pahali duruyor. */
.v{position:absolute;top:34px;bottom:34px;width:1px;background:#DBD5C8}

/* padding-bottom, dikeyde ortalanan blogu YUKARI itiyor. Onsuz CTA'nin alt
   kenari ile ADVERTISEMENT etiketi ust uste biniyordu. */
.L{position:absolute;left:34px;top:0;width:288px;height:100%;z-index:6;padding-bottom:26px;
  display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.lg{width:98px;height:24px;margin-bottom:16px;display:block}
.k{font-size:8.5px;font-weight:600;letter-spacing:3.2px;text-transform:uppercase;color:#A3987F}
h1{margin-top:11px;font-size:31px;font-weight:400;line-height:1.08;letter-spacing:-.2px}
h1 em{font-style:italic}
.sub{margin-top:11px;font-size:11px;line-height:1.5;color:#6E685C;max-width:246px}
/* Dolu turuncu dugme yerine ince kenarli metin baglantisi. Dolu blok bu
   olcekte kreatifin en agir ogesiydi ve gozu tipografiden caliyordu. */
.cta{margin-top:15px;align-self:flex-start;background:none;color:#17150F;
  font:600 10px/1 -apple-system,'Segoe UI',Arial;letter-spacing:2.2px;text-transform:uppercase;
  padding:11px 20px;border:1px solid #17150F;cursor:pointer;pointer-events:auto;
  transition:background .22s,color .22s}
.cta:hover{background:#17150F;color:#F3F0EA}

.P{position:absolute;left:378px;top:0;width:128px;height:100%;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.P svg{width:104px;height:104px;display:block}
.P .nm{margin-top:12px;font-size:8.5px;font-weight:600;letter-spacing:2.2px;
  text-transform:uppercase;color:#A3987F;text-align:center}
.P .pr{margin-top:9px;display:flex;align-items:baseline;gap:9px}
.P .pr s{font-size:13px;color:#A39C8C;text-decoration-thickness:1px}
.P .pr b{font-size:27px;font-weight:400;letter-spacing:-.4px}
/* Onizleme etiketi: secili faz su an yururlukte degilse fiyatin altinda
   durur. Onsuz kreatif gelecekteki bir fiyati bugunun fiyati gibi
   gosteriyordu -- reklamda bu yanlis beyandir. */
.P .pv{margin-top:9px;font-size:8px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:#A39C8C;height:10px;white-space:nowrap}
.P .pv.on{color:#A9853F}

.S{position:absolute;left:562px;top:0;width:374px;height:100%;z-index:4;padding-top:30px}
.hd{display:flex;align-items:baseline;justify-content:space-between}
.hd .t{font-size:8.5px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:#A3987F}
/* letter-spacing kaldirildi: son rakamdan sonra da bosluk birakip sayaci
   sutunun disina tasiriyordu. Hizalamayi tabular-nums zaten sagliyor. */
.hd .cd{font-size:27px;font-variant-numeric:tabular-nums}
.hd .cd i{font-style:normal;color:#C6BFAF}

/* Fazlar KART DEGIL, SATIR. Kutular ucuz duruyordu; sac teli ayraclarla
   ayrilmis satirlar bir fiyat listesi gibi okunuyor ve amac tam olarak o. */
.G{margin-top:16px;border-top:1px solid #DBD5C8}
.c{position:relative;display:flex;align-items:center;height:35px;
  border-bottom:1px solid #DBD5C8;cursor:pointer;pointer-events:auto;
  transition:color .18s}
.c .mk{flex:none;width:12px;height:1px;background:transparent;margin-right:10px;
  transition:background .18s}
.c .ph{flex:none;width:92px;font-size:8.5px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:#A3987F;transition:color .18s}
.c .of{flex:1;font-size:19px;letter-spacing:-.2px;color:#8E8877;transition:color .18s}
.c .of u{text-decoration:none;font-size:10px;letter-spacing:1.4px;margin-left:3px;
  text-transform:uppercase;font-family:-apple-system,'Segoe UI',Arial;font-weight:600}
.c .pz{flex:none;font-size:15px;color:#8E8877;transition:color .18s}
.c.now .ph{color:#17150F}
.c.now .of,.c.now .pz{color:#17150F}
.c.now .mk{background:#17150F}
.c.sec .mk{background:#A9853F;height:2px}
.c.sec .ph{color:#A9853F}

/* Zaman seridi: uc fazin GERCEK uzunluklari oraninda. Esit uce bolmek
   denendi -- pazartesiye kadar suren son faz, on iki saatlik ilk fazla
   ayni genislikte gorununce serit yalan soyluyordu. */
.T{position:relative;height:1px;margin-top:19px;background:#DBD5C8}
.T i{position:absolute;top:0;height:1px;display:block;background:#C6BFAF}
.T i.a{background:#17150F;height:2px;top:-.5px}
.T b{position:absolute;top:-3px;width:1px;height:7px;background:#A9853F}
.tl{display:flex;justify-content:space-between;margin-top:9px;
  font-size:7.5px;font-weight:600;letter-spacing:1.6px;color:#A39C8C}

/* Yuzen "Choose a phase" ipucu KALDIRILDI: sag altta zaman seridi
   etiketlerinin ("MON 9AM") uzerine biniyordu, ustelik sol sutundaki
   aciklama zaten ayni seyi soyluyor. */
.adv{position:absolute;left:34px;bottom:14px;z-index:9;font-size:7px;font-weight:600;
  letter-spacing:1.4px;color:#C6BFAF}
@media(prefers-reduced-motion:reduce){.c,.cta{transition:none}}
</style></head><body>

<div class="b" id="B">
  <div class="v" style="left:350px"></div>
  <div class="v" style="left:534px"></div>

  <div class="L">
    <svg class="lg" viewBox="0 0 180 44" aria-label="ORSA">
      <circle cx="12" cy="16" r="8.4" fill="none" stroke="#17150F" stroke-width="1.6"/>
      <text x="0" y="41" fill="#17150F" font-family="Didot,Bodoni MT,Georgia,serif"
            font-size="20" letter-spacing="7">ORSA</text>
    </svg>
    <div class="k">Black Friday</div>
    <h1 class="sf">Thirty per cent.<br><em>Then twenty.</em></h1>
    <div class="sub">The discount steps down twice before Monday. Choose a phase to see what it costs then.</div>
    <button class="cta" id="C">Shop the sale</button>
  </div>

  <div class="P">
    <svg viewBox="0 0 100 100" aria-label="The Ribbed Jumper" fill="none"
         stroke="#17150F" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 24 L44 16 Q50 22 56 16 L70 24 L84 34 L88 76 L76 78 L70 46 L70 88 Q50 92 30 88 L30 46 L24 78 L12 76 L16 34 Z"/>
      <path d="M44 16 Q50 22.6 56 16"/>
      <path d="M30 82 Q50 86 70 82"/>
      <path d="M76 71 L88 69" /><path d="M12 69 L24 71"/>
      <g stroke="#B7AF9C" stroke-width=".9">
        <path d="M38 30 V85"/><path d="M46 29 V87"/><path d="M54 29 V87"/><path d="M62 30 V85"/>
      </g>
    </svg>
    <div class="nm">The Ribbed Jumper</div>
    <div class="pr sf"><s>&pound;69</s><b>&pound;<span id="PZ">48.30</span></b></div>
    <div class="pv on" id="PV">Live now</div>
  </div>

  <div class="S">
    <div class="hd">
      <div class="t">Phase one ends in</div>
      <div class="cd sf" id="CD">00<i>:</i>00<i>:</i>00</div>
    </div>
    <div class="G" id="G"></div>
    <div class="T" id="T"><b id="MK"></b></div>
    <div class="tl"><span>FRI 8AM</span><span>8PM</span><span>SUN 5PM</span><span>MON 9AM</span></div>
  </div>

  <div class="adv">ADVERTISEMENT</div>
</div>

<script>
var clickTag = "https://example.com/orsa";

/* ---------------------------------------------------------------------------
   FAZLI INDIRIM SAYACI

   Perakendede Black Friday tek bir indirim degil, saati belli KADEMELERDIR:
   ilk saatlerde en derin indirim, sonra kademe kademe geri cekilir. Kreatif
   bunu oldugu gibi gosteriyor -- alicinin "bekleyeyim, daha da ucuzlar"
   diye dusunmesini engelleyen sey tam olarak bu.

   SAYAC NEDEN GORELI DEGIL: "yuklendikten dort saat sonra" gibi bir sayac
   her izleyicide bastan baslar ve hicbir zaman bitmez; reklam sunucusu
   kreatifi gunlerce onbellekte tutar. Bitis SABIT bir an olmak zorunda.

   NEGATIF SAYACA KARSI: kampanyalar uzatilir, kreatif yerinde kalir. Sabit
   tarihli sayaclarin klasik hatasi eksiye dusup "-02:14:07" yazmaktir.
   Burada sure bitince sayac sifirda KILITLENIR ve bir sonraki faza gecer.
--------------------------------------------------------------------------- */

/* Uretimde bu deger brifingden gelen tam ISO damgasidir. Demoda kademeler
   bugunun saatlerine oturuyor ki sayac gercek bir aralik gostersin. */
function bugun(saat) { var d = new Date(); d.setHours(saat, 0, 0, 0); return d.getTime(); }

var ACILIS = bugun(8);
var FAZ = [
  { ad: "Phase one", ind: 30, biter: bugun(20) },
  { ad: "Phase two", ind: 20, biter: bugun(20) + 45 * 3600e3 },
  { ad: "Final",     ind: 10, biter: bugun(20) + 61 * 3600e3 }
];
/* Serit uzunluklari elle yazilmiyor, bitis damgalarindan TURETILIYOR. Elle
   yazildiginda tarihi degistirip orani guncellemeyi unutmak, seridin
   sessizce yanlis olmasi demekti. */
FAZ.forEach(function (f, i) { f.sur = (f.biter - (i ? FAZ[i - 1].biter : ACILIS)) / 3600e3; });

var LISTE = 69;

var G = document.getElementById("G"), CD = document.getElementById("CD"),
    PZ = document.getElementById("PZ"), PV = document.getElementById("PV"),
    T = document.getElementById("T"), MK = document.getElementById("MK"),
    B = document.getElementById("B");

function fiyat(ind) { return (LISTE * (100 - ind) / 100).toFixed(2); }

var kart = [];
FAZ.forEach(function (f, i) {
  var d = document.createElement("div");
  d.className = "c";
  d.innerHTML =
    '<span class="mk"></span>' +
    '<span class="ph">' + f.ad + '</span>' +
    '<span class="of sf">' + f.ind + '<u>% off</u></span>' +
    '<span class="pz sf">&pound;' + fiyat(f.ind) + '</span>';
  d.addEventListener("click", function (e) { e.stopPropagation(); sec(i); });
  G.appendChild(d);
  kart.push(d);
});

var toplamSaat = FAZ.reduce(function (a, f) { return a + f.sur; }, 0);
var yer = 0;
FAZ.forEach(function (f, i) {
  var w = f.sur / toplamSaat * 100;
  var s = document.createElement("i");
  s.className = i === 0 ? "a" : "";
  s.style.left = yer + "%"; s.style.width = (w - 0.5) + "%";
  T.appendChild(s);
  yer += w;
});

var secili = 0, aktif = 0;
function sec(i) {
  secili = i;
  PZ.textContent = fiyat(FAZ[i].ind);
  for (var k = 0; k < kart.length; k++) {
    kart[k].className = "c" + (k === aktif ? " now" : "") + (k === secili ? " sec" : "");
  }
  PV.textContent = i === aktif ? "Live now" : "Preview only";
  PV.className = i === aktif ? "pv on" : "pv";
}

function iki(n) { return (n < 10 ? "0" : "") + n; }
function tik() {
  var simdi = Date.now();

  var yeni = FAZ.length - 1;
  for (var i = 0; i < FAZ.length; i++) { if (simdi < FAZ[i].biter) { yeni = i; break; } }
  if (yeni !== aktif) { aktif = yeni; sec(secili < aktif ? aktif : secili); }

  var kalan = Math.max(0, FAZ[aktif].biter - simdi);      /* sifirda kilitli */
  var sn = Math.floor(kalan / 1000);
  var gun = Math.floor(sn / 86400);
  var s = Math.floor(sn / 3600) % 24, d = Math.floor(sn / 60) % 60, k = sn % 60;
  CD.innerHTML = gun > 0
    ? gun + "<i>d</i>" + iki(s) + "<i>:</i>" + iki(d)
    : iki(s) + "<i>:</i>" + iki(d) + "<i>:</i>" + iki(k);

  var dilim = T.querySelectorAll("i");
  for (i = 0; i < dilim.length; i++) dilim[i].className = i === aktif ? "a" : "";

  var son = FAZ[FAZ.length - 1].biter;
  var yol = (simdi - ACILIS) / (son - ACILIS);
  MK.style.left = (Math.max(0, Math.min(1, yol)) * 100) + "%";
}

B.addEventListener("click", function () { window.open(clickTag, "_blank"); });

sec(0);
tik();
setInterval(tik, 1000);
</script>
</body></html>
