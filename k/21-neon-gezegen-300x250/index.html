<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Neon Star Shooter 300x250 &mdash; Pick a planet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{width:300px;height:250px;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
.b{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;background:#05060E;
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff}

/* Sahne tam kaplama. 970x250'de sahne sag yariya oturuyordu; bu formatta
   ayni boluntu denendi ve iki yarim da kullanilmaz kaldi -- 300 pikselde
   sahne ya tam ekran olur ya hic olmaz. */
.S{position:absolute;inset:0;overflow:hidden}
.S .im{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .45s ease}
.S .im.on{opacity:1}
/* Alt perde: yazi sahnenin uzerinde duruyor, okunurlugu bu saglıyor. */
.S::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,#05060E 0%,rgba(5,6,14,.88) 30%,rgba(5,6,14,.12) 56%,
             rgba(5,6,14,.38) 88%,rgba(5,6,14,.62) 100%)}

.lg{position:absolute;left:16px;top:14px;z-index:5;line-height:.98;pointer-events:none}
.lg b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px;color:#fff;
  text-shadow:0 0 12px rgba(120,225,255,.6)}
.lg i{display:block;font-style:normal;font-size:16px;font-weight:800;letter-spacing:-.3px;
  color:#FF2E9A;text-shadow:0 0 14px rgba(255,46,154,.8)}

.D{position:absolute;left:16px;right:16px;bottom:74px;z-index:6;display:flex;
  align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.D .nm{min-width:0}
.D .nm b{display:block;font-size:21px;font-weight:800;letter-spacing:1px;line-height:1;
  transition:color .35s,text-shadow .35s}
.D .nm span{display:block;margin-top:6px;font-size:7.5px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 2px 9px rgba(0,0,0,.9)}

/* ---------------------------------------------------------------------------
   GEZEGEN SEMBOLLERI

   970'te sekmelerde hem sembol hem ad var. Uc yuz pikselde alti ad yan yana
   50'ser piksele dusuyor ve "TARTAROS" sigmiyordu; burada yalniz semboller
   duruyor, secili olanin adi zaten sollarinda yaziyor.

   Duz renkli daire denendi ve birakildi: alti daire yan yana konunca tek
   ayirt edici sey renk kaliyor, ustelik 970'lik surumle ayni kampanyanin
   parcasi gibi durmuyordu.
--------------------------------------------------------------------------- */
.P{display:flex;align-items:center;gap:6px;flex:none;pointer-events:auto}
/* Secili sembol yalnizca opaklik/olcek ile ayrisiyordu ve bu olcekte fark
   zayif kaliyordu. Gezegenin renginde ince bir alt cizgi -- 970'lik surumun
   sekme cizgisiyle ayni isaret. */
.p{position:relative;width:17px;height:17px;cursor:pointer;opacity:.32;
  transition:opacity .2s,transform .2s}
.p svg{width:17px;height:17px;display:block}
.p::after{content:'';position:absolute;left:1px;right:1px;bottom:-5px;height:1.5px;
  background:var(--c);opacity:0;transition:opacity .2s}
.p.on{opacity:1;transform:scale(1.14)}
.p.on::after{opacity:1}

.cta{position:absolute;left:16px;right:16px;bottom:26px;z-index:7;
  background:#22E0FF;color:#04212B;border:0;
  font:800 11px/1 -apple-system,'Segoe UI',Arial;letter-spacing:1.8px;text-transform:uppercase;
  padding:13px 10px;border-radius:999px;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 20px rgba(34,224,255,.45);transition:background .2s}
.cta:hover{background:#fff}

.hint{position:absolute;right:16px;top:16px;z-index:8;font-size:7.5px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.42);
  pointer-events:none;transition:opacity .4s}
.hint.h{opacity:0}
.adv{position:absolute;left:8px;bottom:6px;z-index:9;font-size:7px;font-weight:600;
  letter-spacing:1.3px;color:rgba(255,255,255,.26)}
@media(prefers-reduced-motion:reduce){.S .im,.p,.D .nm b{transition:none}}
</style></head><body>

<div class="b" id="B">
  <div class="S" id="S"></div>
  <div class="lg"><b>Neon</b><i>Star Shooter</i></div>

  <div class="D">
    <div class="nm"><b id="WN">HAIDES</b><span>20 levels &middot; 20 bosses</span></div>
    <div class="P" id="P"></div>
  </div>

  <button class="cta" id="C">Play free</button>
