<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>ALDRA 160x600 &mdash; Animated HTML5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:160px;height:600px;overflow:hidden;background:#0F1A2B;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;
  background:#0F1A2B;color:#F4F1EA;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}

.f1 h1,.f1 .alt,.f2 .ust,.s1,.s2,.s3,.f3 .lg,.f3 h2,.f3 .cta{opacity:0}
.f1 h1{transform:translateY(12px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.f1 h1.in{opacity:1;transform:none}
.f1 h1.out{opacity:0;transform:translateY(-8px);transition-duration:.35s}
.f1 .alt{transform:translateY(8px);transition:opacity .45s,transform .45s ease}
.f1 .alt.in{opacity:1;transform:none}
.f1 .alt.out{opacity:0;transition-duration:.3s}
.kalkan{opacity:0;transition:opacity .3s}
.kalkan.in{opacity:1}
.kalkan.out{opacity:0;transition:opacity .35s}
.kalkan path{fill:none;stroke:#D6B25E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.kalkan.in .dis{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
.kalkan.in .tik{stroke-dashoffset:0;transition:stroke-dashoffset .5s ease .9s}
.f2 .ust{transition:opacity .4s}
.f2 .ust.in{opacity:1}
.f2 .ust.out{opacity:0}
.cizgi{transform:scaleX(0);transform-origin:0 0;transition:transform 2.4s cubic-bezier(.4,0,.2,1),opacity .3s}
.cizgi.in{transform:none}
.cizgi.out{opacity:0}
.dik .cizgi{transform:scaleY(0)}
.dik .cizgi.in{transform:none}
.ad{transition:opacity .4s,transform .4s ease;transform:translateY(6px)}
.ad.in{opacity:1;transform:none}
.ad.out{opacity:0}
.ad b{background:#2A3A52;border:2px solid #2A3A52;transition:background .3s,border-color .3s,box-shadow .3s}
.ad.in b{background:#D6B25E;border-color:#D6B25E;box-shadow:0 0 0 4px rgba(214,178,94,.18)}
.f3 .lg{transform:scale(.92);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1)}
.f3 .lg.in{opacity:1;transform:none}
.f3 h2{transform:translateY(8px);transition:opacity .45s,transform .45s ease}
.f3 h2.in{opacity:1;transform:none}
.f3 .cta{transform:translateY(8px);transition:opacity .4s,transform .4s ease,background .2s,color .2s}
.f3 .cta.in{opacity:1;transform:none;pointer-events:auto}

.eb{position:absolute;font:600 6.5px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:#D6B25E}
.f1,.f2,.f3{position:absolute;inset:0}
.f1 h1,.f3 h2{font:700 26px/1.02 Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif;letter-spacing:-.3px;color:#F4F1EA}
.f3 h2{font-size:19px;line-height:1.08}
.f1 .alt{font:400 13px/1.25 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#A9B4C4}
.f2 .ust{position:absolute;font:600 7px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:#D6B25E}
.iz{position:absolute;display:flex;justify-content:space-between;align-items:flex-start}
.iz .cizgi{position:absolute;left:6px;right:6px;top:5px;height:2px;background:#D6B25E;opacity:.55}
.iz.dik{flex-direction:column}
.iz.dik .cizgi{top:6px;bottom:6px;left:5px;right:auto;width:2px;height:auto;transform-origin:0 0}
.ad{position:relative;display:flex;align-items:center;gap:8px;font:600 12.5px/1.15 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#F4F1EA;white-space:nowrap}
.ad b{display:block;width:11px;height:11px;border-radius:50%;flex:none}
.lg{display:inline-flex;align-items:center;gap:6px;font:700 14px Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif;letter-spacing:3px;color:#F4F1EA}
.lg i{width:11px;height:11px;border-radius:2px;background:#D6B25E;display:block;transform:rotate(45deg) scale(.8)}
.cta{display:inline-block;background:#D6B25E;color:#0A121F;border:0;border-radius:3px;cursor:pointer;pointer-events:none;
  font:800 9.5px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.0px;text-transform:uppercase;padding:13px 0;white-space:nowrap}
.cta:hover{background:#F4F1EA}
.yasal{position:absolute;font:500 5.5px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#2A3A52;pointer-events:none}

.eb{left:18px;top:28px}
.f1 h1{position:absolute;left:18px;top:56px;width:124px}
.f1 .alt{position:absolute;left:18px;top:170px;width:124px}
.kalkan{position:absolute;left:30px;top:280px}
.f2 .ust{left:18px;top:56px}
.iz{left:18px;top:96px;height:260px}
.ad{white-space:normal;align-items:flex-start}
.ad b{margin-top:2px}
.f3 .lg{position:absolute;left:18px;top:58px}
.f3 h2{position:absolute;left:18px;right:18px;top:100px}
.f3 .cta{position:absolute;left:18px;right:18px;bottom:32px;text-align:center}
.yasal{left:18px;bottom:18px}

.adv{position:absolute;left:18px;bottom:8px;
  font-size:6.5px;font-weight:600;letter-spacing:1.2px;color:#2A3A52;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="eb">ALDRA Injury Law</div>
<div class="f1"><h1>Hurt in a crash?</h1><p class="alt">Know what your claim is worth.</p><svg class="kalkan" viewBox="0 0 100 120" width="100" height="120">
<path class="dis" pathLength="1" d="M50 6 L90 22 V56 C90 86 71 105 50 114 C29 105 10 86 10 56 V22 Z"/>
<path class="tik" pathLength="1" d="M32 60 L45 73 L69 45"/></svg></div>
<div class="f2"><div class="ust">Three steps, one call</div><div class="iz dik"><i class="cizgi"></i>
<div class="ad s1"><b></b>Free case review</div><div class="ad s2"><b></b>We handle the insurer</div><div class="ad s3"><b></b>No fee unless we win</div></div></div>
<div class="f3"><div class="lg"><i></i>ALDRA</div><h2>Talk to a lawyer today, free.</h2><button class="cta" data-cta="1">Free case review</button></div>
<div class="yasal">Attorney advertising</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "../../landing.html?b=aldra-demo";

var AKIS = [
  [0.1, ".f1 h1", "in"], [0.4, ".kalkan", "in"], [1.4, ".f1 .alt", "in"],
  [4.1, ".f1 .alt", "out"], [4.2, ".kalkan", "out"], [4.3, ".f1 h1", "out"],
  [4.6, ".f2 .ust", "in"], [4.7, ".cizgi", "in"], [5.2, ".s1", "in"], [6.1, ".s2", "in"], [7.0, ".s3", "in"],
  [9.5, ".s1", "out"], [9.5, ".s2", "out"], [9.5, ".s3", "out"], [9.6, ".cizgi", "out"], [9.6, ".f2 .ust", "out"],
  [10.4, ".f3 .lg", "in"], [10.9, ".f3 h2", "in"], [11.5, ".f3 .cta", "in"]
];
var SURE = 15, DONGU = 3;

var hepsi = [];
AKIS.forEach(function (a) { Array.prototype.forEach.call(document.querySelectorAll(a[1]), function (e) { if (hepsi.indexOf(e) < 0) hepsi.push(e); }); });
function sifirla() { hepsi.forEach(function (e) { e.classList.remove("in", "out"); }); }
function uygula(a) {
  Array.prototype.forEach.call(document.querySelectorAll(a[1]), function (e) {
    if (a[2] === "in") { e.classList.remove("out"); e.classList.add("in"); } else { e.classList.add("out"); }
  });
}
var azHareket = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var dongu = 0, bas = 0, i = 0, elle = false;
function sonKare() { sifirla(); AKIS.forEach(function (a) { if (a[0] >= 9.5) uygula(a); }); }
function adim(z) {
  if (elle) return;
  if (!bas) bas = z;
  var t = (z - bas) / 1000;
  while (i < AKIS.length && AKIS[i][0] <= t) { uygula(AKIS[i]); i++; }
  if (t >= SURE) { dongu++; if (dongu >= DONGU) { sonKare(); return; } sifirla(); bas = z; i = 0; }
  requestAnimationFrame(adim);
}
function ayarla(t) { elle = true; sifirla(); AKIS.forEach(function (a) { if (a[0] <= t) uygula(a); }); }
if (azHareket) sonKare(); else requestAnimationFrame(adim);

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
