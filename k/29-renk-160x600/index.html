<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>ORSA 160x600 &mdash; Four dyes, four prices</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:160px;height:600px;overflow:hidden;background:#F3F0EA;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;
  background:#F3F0EA;color:#17150F;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}

.lg{width:64px;height:16px;display:block}
.cta{display:inline-block;background:none;color:#17150F;border:1px solid #17150F;cursor:pointer;
  font:600 9px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;padding:12px 0;
  transition:background .22s,color .22s;white-space:nowrap}
.cta:hover{background:#17150F;color:#F3F0EA}

.kz{display:block}
.kz .gov{fill:var(--c);stroke:rgba(23,21,15,.22);stroke-width:1.2;transition:fill .45s}
.kz .golge{fill:rgba(0,0,0,.12);pointer-events:none}
.kz .isik{fill:rgba(255,255,255,.14);pointer-events:none}
.kz .yaka{fill:rgba(0,0,0,.22)}
.kz .rib path{fill:none;stroke:rgba(23,21,15,.28);stroke-width:1.4;stroke-linecap:round}

.et{position:absolute;background:#fff;border:1px solid #DBD5C8;padding:5.5px 7.699999999999999px 6.050000000000001px;
  transform-origin:50% 50%;transition:transform .16s ease-in;box-shadow:0 2px 8px rgba(23,21,15,.10);
  display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.et.kapali{transform:scaleX(0)}
.et i{position:absolute;left:50%;top:-4.95px;width:3.8499999999999996px;height:3.8499999999999996px;margin-left:-1.98px;
  border:1px solid #6E685C;border-radius:50%;background:#F3F0EA}
.et s{font-size:6.82px;color:#6E685C;text-decoration-thickness:1px;min-height:8.8px;line-height:1.2}
.et b{font:400 14.3px/1 Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif;letter-spacing:-.3px;color:#17150F}
.et em{font-style:normal;font-size:5.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#B4412F;margin-top:3px;min-height:6.6px}
.et.yok b{color:#6E685C;text-decoration:line-through}

.sc{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0;color:#17150F}
.sw i{position:relative;width:16px;height:16px;border-radius:50%;display:block;flex:none;
  box-shadow:inset 0 0 0 1px rgba(23,21,15,.18);transition:transform .2s,box-shadow .2s}
.sw.on i{box-shadow:0 0 0 2px #F3F0EA,0 0 0 3.5px #17150F;transform:scale(.92)}
.sw.yok i::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:1.5px;background:#F3F0EA;
  box-shadow:0 0 0 1px #17150F;transform:rotate(-45deg)}
.sw span{font-size:9px;letter-spacing:.3px;white-space:nowrap}
.sw.yok span{color:#6E685C;text-decoration:line-through}

.sf{font-family:Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif}
.eb{font-size:8.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#A9853F}
.st{color:#6E685C}
.son{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#6E685C}

.K{position:absolute;inset:0;padding:20px 14px 24px;display:flex;flex-direction:column}
.eb{margin-top:12px;font-size:7px;letter-spacing:2px}
h1{margin-top:8px;font:400 19px/1.1 Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif;letter-spacing:-.2px}
h1 em{font-style:italic}
.M{position:relative;margin:10px auto 0;width:132px;height:150px;display:flex;align-items:center;justify-content:center}
.M .et{left:84px;top:6px}
.fk{margin-top:18px;border-top:1px solid #DBD5C8;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.fk div{display:flex;justify-content:space-between;font-size:7.5px;letter-spacing:.5px;text-transform:uppercase;color:#6E685C}
.fk div b{color:#17150F;font-weight:600;letter-spacing:0;text-transform:none}
.sc{margin-top:12px;gap:9px}
.st{margin-top:14px;font-size:9.5px;line-height:1.35;min-height:26px}
.son{margin-top:8px;font-size:7px;letter-spacing:1.5px}
.cta{margin-top:auto;width:100%;text-align:center;pointer-events:auto}

.adv{position:absolute;left:14px;bottom:6px;
  font-size:6.5px;font-weight:600;letter-spacing:1.2px;color:#DBD5C8;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="K">
  <svg class="lg" viewBox="0 0 180 44" aria-label="ORSA"><text x="0" y="34" font-family="Didot,'Bodoni MT','Hoefler Text',Garamond,Georgia,'Times New Roman',serif" font-size="34" letter-spacing="10" fill="#17150F">ORSA</text></svg>
  <div class="eb">Autumn edit</div>
  <h1>Same knit, four dyes, <em>four prices.</em></h1>
  <div class="M"><svg class="kz" id="KZ" width="148" height="148" viewBox="0 0 200 200" style="--c:#B5602F">
    <path class="gov" d="M66 46C78 40 88 38 100 38C112 38 122 40 134 46L168 60L194 140L162 152L148 104L148 186L52 186L52 104L38 152L6 140L32 60Z"/>
    <path class="golge" d="M100 38C112 38 122 40 134 46L168 60L194 140L162 152L148 104L148 186L100 186Z"/>
    <path class="isik" d="M66 46C78 40 88 38 100 38L100 64C92 64 84 66 78 72L52 186L52 104L38 152L6 140L32 60Z"/>
    <path class="yaka" d="M78 44C84 58 92 64 100 64C108 64 116 58 122 44C116 40 108 38 100 38C92 38 84 40 78 44Z"/>
    <g class="rib">
      <path d="M54 176L146 176M54 181L146 181"/>
      <path d="M12 134L42 145M14 128L44 139"/>
      <path d="M188 134L158 145M186 128L156 139"/>
      <path d="M80 47C86 60 93 66 100 66C107 66 114 60 120 47"/>
    </g>
  </svg><div class="et" id="ET"><i></i><s id="ES"></s><b id="EF"></b><em id="EI"></em></div></div>
  <div class="sc" id="SC" data-kontrol="1"></div>
  <div class="st" id="ST"></div>
  <div class="son">Until Sunday 23:59</div>
  <div class="fk"><div><span>Yarn</span><b>Merino, 100%</b></div><div><span>Weight</span><b>Mid, 12 gauge</b></div><div><span>Returns</span><b>30 days, free</b></div></div>
  <button class="cta" id="CTA" data-cta="1">Shop Lund</button>
</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "https://example.com/orsa-lund";

var FIYAT = 149;
var RENK = [
  { ad: "Cinnamon", hex: "#B5602F", ind: 30, stok: "3 left in M, 5 in L" },
  { ad: "Ink",      hex: "#1F2436", ind: 20, stok: "All sizes in stock" },
  { ad: "Bone",     hex: "#E8E1D3", ind: 0,  stok: "New this season" },
  { ad: "Moss",     hex: "#4E5E3F", ind: 0,  stok: "Sold out", yok: true }
];
function fiyat(r) { return Math.round(FIYAT * (100 - r.ind) / 100); }

var KZ = document.getElementById("KZ"), ET = document.getElementById("ET"), ES = document.getElementById("ES"),
    EF = document.getElementById("EF"), EI = document.getElementById("EI"), SC = document.getElementById("SC"),
    ST = document.getElementById("ST"), CTA = document.getElementById("CTA"), RA = document.getElementById("RA");
var sec = 0, dokunuldu = false, zamanlayici = null, dugme = [];
if (SC) RENK.forEach(function (r, i) {
  var b = document.createElement("button");
  b.className = "sw" + (r.yok ? " yok" : "");
  b.innerHTML = '<i style="background:' + r.hex + '"></i>' + (true ? '<span>' + r.ad + '</span>' : '');
  b.addEventListener("click", function (e) { e.stopPropagation(); dokunuldu = true; git(i); });
  SC.appendChild(b); dugme.push(b);
});
function yazEtiket(r) {
  ES.textContent = r.ind ? "\u20AC" + FIYAT : "";
  EF.textContent = "\u20AC" + fiyat(r);
  EI.textContent = r.yok ? "Sold out" : r.ind ? "\u2212" + r.ind + "%" : "";
  ET.className = "et" + (r.yok ? " yok" : "");
}
function git(i) {
  sec = i;
  var r = RENK[i];
  KZ.style.setProperty("--c", r.hex);
  for (var k = 0; k < dugme.length; k++) dugme[k].classList.toggle("on", k === i);
  if (ST) ST.textContent = r.ad + " \u00b7 " + r.stok;
  if (RA) RA.textContent = r.ad;
  if (CTA) CTA.textContent = r.yok ? "Notify me" : "Shop Lund";
  /* etiket kapanir, kapaliyken yazilir, acilir */
  if (zamanlayici) clearTimeout(zamanlayici);
  ET.classList.add("kapali");
  zamanlayici = setTimeout(function () { yazEtiket(r); ET.classList.remove("kapali"); }, 170);
}
yazEtiket(RENK[0]); git(0);
/* Dokunulana kadar renkler siraya girer: mekanik ilk saniyede gorulsun. */
(function dongu() {
  setTimeout(function () { if (!dokunuldu) { git((sec + 1) % RENK.length); } dongu(); }, 2400);
})();

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
