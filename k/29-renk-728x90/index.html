  <div class="st" id="ST"></div>
  <button class="cta" id="CTA" data-cta="1">Shop Lund</button>

<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "../../landing.html?b=orsa-lund";

var FIYAT = 149;
var RENK = [
  { ad: "Burgundy", hex: "#691C2B", ind: 30, stok: "3 left in M, 5 in L" },
  { ad: "Ink",      hex: "#1F2B45", ind: 20, stok: "All sizes in stock" },
  { ad: "Bone",     hex: "#F3F3F5", ind: 0,  stok: "New this season" },
  { ad: "Moss",     hex: "#575B3D", ind: 0,  stok: "Sold out", yok: true }
];
function fiyat(r) { return Math.round(FIYAT * (100 - r.ind) / 100); }

var TI = document.querySelectorAll(".ti"), ET = document.getElementById("ET"), ES = document.getElementById("ES"),
    EF = document.getElementById("EF"), EI = document.getElementById("EI"), SC = document.getElementById("SC"),
    ST = document.getElementById("ST"), CTA = document.getElementById("CTA"), RA = document.getElementById("RA");
var sec = 0, dokunuldu = false, zamanlayici = null, dugme = [];
if (SC) RENK.forEach(function (r, i) {
  var b = document.createElement("button");
  b.className = "sw" + (r.yok ? " yok" : "");
  b.innerHTML = '<i style="background:' + r.hex + '"></i>' + (false ? '<span>' + r.ad + '</span>' : '');
  b.addEventListener("click", function (e) { e.stopPropagation(); dokunuldu = true; git(i); });
  SC.appendChild(b); dugme.push(b);
});
function yazEtiket(r) {
  ES.textContent = r.ind ? "\u20AC" + FIYAT : "";
  EF.textContent = "\u20AC" + fiyat(r);
  EI.textContent = r.yok ? "Sold out" : r.ind ? "\u2212" + r.ind + "%" : "";
  ET.className = "et" + (r.yok ? " yok" : "");
}
function git(i) {
  sec = i;
  var r = RENK[i];
  for (var t = 0; t < TI.length; t++) TI[t].classList.toggle("on", t === i);
  for (var k = 0; k < dugme.length; k++) dugme[k].classList.toggle("on", k === i);
  if (ST) ST.textContent = r.ad + " \u00b7 " + r.stok;
  if (RA) RA.textContent = r.ad;
  if (CTA) CTA.textContent = r.yok ? "Notify me" : "Shop Lund";
  /* etiket kapanir, kapaliyken yazilir, acilir */
  if (zamanlayici) clearTimeout(zamanlayici);
  ET.classList.add("kapali");
  zamanlayici = setTimeout(function () { yazEtiket(r); ET.classList.remove("kapali"); }, 170);
}
yazEtiket(RENK[0]); git(0);
/* Dokunulana kadar renkler siraya girer: mekanik ilk saniyede gorulsun. */
(function dongu() {
  setTimeout(function () { if (!dokunuldu) { git((sec + 1) % RENK.length); } dongu(); }, 2400);
})();

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
