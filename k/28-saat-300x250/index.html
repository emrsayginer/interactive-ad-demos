<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>TALLO 300x250 &mdash; Hours back</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:300px;height:250px;overflow:hidden;background:#F4F2FF;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;
  background:#F4F2FF;color:#201B3D;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}


.lg{display:flex;align-items:center;gap:4px;white-space:nowrap}
.lg b{font-size:14px;font-weight:800;letter-spacing:-.5px;color:#201B3D}
.lg i{width:6.3px;height:6.3px;border-radius:50%;background:#5B3DF5;display:block;margin-top:4.8999999999999995px}

.cta{display:inline-block;background:#201B3D;color:#fff;border:0;border-radius:20px;cursor:pointer;
  font:700 9.5px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:10px 16px;transition:background .2s;white-space:nowrap}
.cta:hover{background:#5B3DF5}

.iz{display:grid;grid-template-columns:repeat(var(--c),var(--px));grid-auto-rows:var(--px);gap:var(--g);
  pointer-events:none;align-content:start}
.iz i{display:block;background:#E1DDF8;border-radius:1px;transition:background .18s,transform .18s}
.iz i.on{background:#5B3DF5}

.kd{position:relative;height:26px;cursor:grab;touch-action:none}
.kd:active{cursor:grabbing}
.kd .ray{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:#D9D4F5}
.kd .dolu{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#5B3DF5}
.kd .top{position:absolute;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;
  border:2px solid #5B3DF5;box-shadow:0 1px 4px rgba(32,27,61,.25)}

.num{font:600 1em ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums;color:#201B3D;letter-spacing:-.5px}
.lab{font-size:8px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#7C76A3}
.var{font-size:8px;color:#7C76A3;line-height:1.35}

.K{position:absolute;inset:0;padding:14px 16px 18px;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd .eb{font-size:7.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#7C76A3}
h1{margin-top:5px;font-size:16px;line-height:1.12;font-weight:700;letter-spacing:-.4px}
.M{margin-top:8px}
.M .lab{display:flex;justify-content:space-between}
.M .lab .num{font-size:10px}
.M .kd{margin-top:0}
.M .iz{margin-top:6px}
.alt{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.alt .num{font-size:20px;line-height:1}
.alt .num small{font-size:9px;color:#7C76A3;font-weight:600}
.alt .lab{margin-top:2px}
.cta{flex:none;pointer-events:auto}

.adv{position:absolute;left:16px;bottom:4px;
  font-size:6.5px;font-weight:600;letter-spacing:1.2px;color:#7C76A3;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="K">
  <div class="hd"><div class="lg"><b>tallo</b><i></i></div><div class="eb">Approval workflows</div></div>
  <h1>How many yeses is your week waiting on?</h1>
  <div class="M">
    <div class="lab"><span>Approvals a week</span><span class="num" id="N"></span></div>
    <div class="kd" id="KD" data-kontrol="1" style="width:268px">
    <div class="ray"><div class="dolu" id="KDF"></div><div class="top" id="KDT"></div></div>
  </div>
    <div class="iz" id="IZ" style="--c:60;--px:3.5px;--g:1px;width:269px;height:21.5px" data-rows="5"></div>
  </div>
  <div class="alt">
    <div><div class="num"><span id="SA"></span><small> h a week back</small></div><div class="lab"><span id="YI"></span> a year</div></div>
    <button class="cta" data-cta="1">Start free trial</button>
  </div>
</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "https://example.com/tallo-trial";

var ELLE = 11, OTOM = 1, UCRET = 38, HAFTA = 48, EN_AZ = 20, EN_COK = 600;
function hesap(n) {
  var saat = n * (ELLE - OTOM) / 60;
  return { n: n, saat: saat, gun: saat / 8, yil: Math.round(saat * UCRET * HAFTA) };
}
function para(v) { return "\u20AC" + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function s1(v) { return (Math.round(v * 10) / 10).toString(); }

var IZ = document.getElementById("IZ"), KD = document.getElementById("KD"), KDF = document.getElementById("KDF"),
    KDT = document.getElementById("KDT");
var N_EL = document.getElementById("N"), SA = document.getElementById("SA"), GU = document.getElementById("GU"),
    YI = document.getElementById("YI"), CUM = document.getElementById("CUM");
var n = 120, dokunuldu = false, sonT = 0, yon = 1;
var kareler = [];
if (IZ) {
  var adet = 300, f = document.createDocumentFragment();
  for (var i = 0; i < adet; i++) { var k = document.createElement("i"); f.appendChild(k); kareler.push(k); }
  IZ.appendChild(f);
}
var KARE_ADIM = 2;  /* kucuk izgaralarda bir kare = KARE_ADIM onay */

function ciz() {
  var h = hesap(n);
  for (var i = 0; i < kareler.length; i++) {
    var on = (i + 1) * KARE_ADIM <= n;
    if (on !== (kareler[i].className === "on")) kareler[i].className = on ? "on" : "";
  }
  var p = (n - EN_AZ) / (EN_COK - EN_AZ) * 100;
  if (KDF) { KDF.style.width = p + "%"; KDT.style.left = p + "%"; }
  if (N_EL) N_EL.textContent = n;
  if (SA) SA.textContent = s1(h.saat);
  if (GU) GU.textContent = s1(h.gun);
  if (YI) YI.textContent = para(h.yil);
  if (CUM) CUM.textContent = n + " approvals a week is " + s1(h.saat) + " hours of chasing. Get them back.";
}
function raydan(e) {
  var b = KD.getBoundingClientRect();
  var v = EN_AZ + Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)) * (EN_COK - EN_AZ);
  return Math.round(v / 10) * 10;
}
if (KD) {
  var basili = false;
  KD.addEventListener("pointerdown", function (e) { basili = true; dokunuldu = true; KD.setPointerCapture(e.pointerId); n = raydan(e); ciz(); });
  KD.addEventListener("pointermove", function (e) { if (basili) { n = raydan(e); ciz(); } });
  KD.addEventListener("pointerup", function () { basili = false; });
  KD.addEventListener("pointercancel", function () { basili = false; });
}
/* Dokunulana kadar kaydirici 60-360 arasinda gidip geliyor: izgaranin
   doldugu ilk saniyede gorulsun. */
var nf = n;
function dongu(z) {
  if (!dokunuldu) {
    if (!sonT) sonT = z;
    var dt = Math.min(50, z - sonT); sonT = z;
    nf += yon * dt / 1000 * 70;
    if (nf > 360) { nf = 360; yon = -1; } else if (nf < 60) { nf = 60; yon = 1; }
    var yeni = Math.round(nf / 10) * 10;
    if (yeni !== n) { n = yeni; ciz(); }
  }
  requestAnimationFrame(dongu);
}
ciz();
requestAnimationFrame(dongu);

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
