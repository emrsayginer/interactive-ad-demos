<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>VELTIC 300x250 &mdash; Test your reflexes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:300px;height:250px;overflow:hidden;background:#050B14;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;color:#EAF2FF;
  background:linear-gradient(180deg,#0A1220 0%,#050B14 100%);
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit;border:0;background:none}

.mesh{position:absolute;inset:0;background:
  radial-gradient(130% 90% at 10% -10%,#123A5C 0%,transparent 55%),
  radial-gradient(120% 90% at 100% 15%,#0E5C4E 0%,transparent 50%),
  radial-gradient(150% 120% at 50% 130%,#1A2E6B 0%,transparent 60%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>')}

.top{position:absolute;left:14px;top:10px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:6}
.lg{display:flex;align-items:center;gap:6px}
.lg b{font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  background:linear-gradient(90deg,#EAF2FF,#1FB6FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg i{width:4px;height:4px;border-radius:50%;background:#1FB6FF;box-shadow:0 0 6px rgba(31,182,255,.8);display:block}
.adv{font-size:6px;font-weight:700;letter-spacing:1px;color:rgba(234,242,255,.4);text-transform:uppercase}

.stage{position:absolute;left:0;right:0;top:36px;bottom:38px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px}
.msg{font-size:12.5px;font-weight:700;letter-spacing:.3px;color:rgba(234,242,255,.85);text-align:center;
  min-height:16px}
.dot{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#4C6489,#3A4B66 70%);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;display:flex;align-items:center;
  justify-content:center;pointer-events:auto;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.dot.wait{animation:pulse 1.1s ease-in-out infinite}
.dot.armed{background:radial-gradient(circle at 34% 30%,#6BF0A6,#33D17A 70%);
  box-shadow:0 0 0 6px rgba(51,209,122,.18),0 0 26px 4px rgba(51,209,122,.6)}
.dot.early{background:radial-gradient(circle at 34% 30%,#FF9B9B,#FF5C5C 70%);box-shadow:0 0 20px rgba(255,92,92,.5)}
.dot.done{background:radial-gradient(circle at 34% 30%,#7FDBFF,#1FB6FF 70%);box-shadow:0 0 24px rgba(31,182,255,.6)}
.dot span{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#071427}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.result{font:700 15px/1 ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:.4px;
  background:linear-gradient(90deg,#EAF2FF,#1FB6FF);-webkit-background-clip:text;background-clip:text;color:transparent;
  min-height:18px}

.alt{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;background:linear-gradient(180deg,rgba(5,11,20,0),rgba(5,11,20,.8) 40%)}
.msj{font-size:9.5px;font-weight:600;color:rgba(234,242,255,.9)}
.cta{background:linear-gradient(135deg,#7FDBFF,#1FB6FF);color:#071427;font-size:9px;font-weight:800;border-radius:13px;
  padding:8px 13px;letter-spacing:.4px;text-transform:uppercase;pointer-events:auto;white-space:nowrap;
  box-shadow:0 2px 10px rgba(31,182,255,.4),0 0 0 1px rgba(255,255,255,.25) inset}
@media(prefers-reduced-motion:reduce){.dot.wait{animation:none}}
</style></head><body>
<div id="R">
<div class="mesh"></div>
<div class="grain"></div>

<div class="top"><div class="lg"><b>veltic</b><i></i></div><div class="adv">Advertisement</div></div>

<div class="stage" data-kontrol="1">
  <div class="msg" id="MSG">Get ready&hellip;</div>
  <div class="dot wait" id="DOT"><span id="DOTLBL"></span></div>
  <div class="result" id="RESULT"></div>
</div>

<div class="alt">
  <div class="msj">Fibre broadband, zero lag</div>
  <button class="cta" data-cta="1">Check your speed</button>
</div>
</div>
<script>
var clickTag = "../../landing.html?b=veltic";

var DOT = document.getElementById("DOT"), DOTLBL = document.getElementById("DOTLBL"),
    MSG = document.getElementById("MSG"), RESULT = document.getElementById("RESULT");
var state = "idle", armTime = 0, waitTimer = null, autoTimer = null;

function startRound() {
  state = "wait";
  DOT.className = "dot wait";
  DOTLBL.textContent = "";
  MSG.textContent = "Get ready…";
  RESULT.textContent = "";
  var delay = 1100 + Math.random() * 1000;
  waitTimer = setTimeout(arm, delay);
}
function arm() {
  state = "armed";
  DOT.className = "dot armed";
  DOTLBL.textContent = "TAP";
  MSG.textContent = "Tap now!";
  armTime = performance.now();
  /* Kimse dokunmadan da mekanik bir kere kendini gostersin diye
     gerceke yakin bir tepki suresiyle kendi kendine "tiklar". */
  autoTimer = setTimeout(function () { hit(210); }, 850);
}
function hit(simMs) {
  if (state !== "armed") return;
  clearTimeout(autoTimer);
  var ms = simMs != null ? simMs : Math.round(performance.now() - armTime);
  state = "done";
  var label = ms < 220 ? "Lightning fast" : ms < 380 ? "Quick" : "Could be faster";
  DOT.className = "dot done";
  DOTLBL.textContent = "✓";
  MSG.textContent = label;
  RESULT.textContent = ms + " ms";
}
DOT.addEventListener("click", function (e) {
  e.stopPropagation();
  if (state === "wait") {
    clearTimeout(waitTimer);
    state = "early";
    DOT.className = "dot early";
    DOTLBL.textContent = "!";
    MSG.textContent = "Too soon — try again";
    RESULT.textContent = "";
    setTimeout(startRound, 900);
  } else if (state === "armed") {
    hit(null);
  } else if (state === "done") {
    startRound();
  }
});

startRound();

(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
