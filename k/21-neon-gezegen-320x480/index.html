<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Neon Star Shooter 320x480 &mdash; Pick a planet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
body{width:320px;height:480px;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
.b{position:relative;width:320px;height:480px;overflow:hidden;cursor:pointer;background:#05060E;
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff}

.S{position:absolute;left:0;top:0;width:320px;height:300px;overflow:hidden}
.S .im{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .45s ease}
.S .im.on{opacity:1}
.S::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,#05060E 0%,rgba(5,6,14,.66) 20%,rgba(5,6,14,0) 46%,
             rgba(5,6,14,.36) 88%,rgba(5,6,14,.60) 100%)}

.fr{position:absolute;left:14px;top:14px;right:14px;height:272px;z-index:4;pointer-events:none}
.fr b{position:absolute;width:14px;height:14px;display:block;opacity:.85}
.fr .c1{left:0;top:0;border-left:1.5px solid #22E0FF;border-top:1.5px solid #22E0FF}
.fr .c2{right:0;top:0;border-right:1.5px solid #FF2E9A;border-top:1.5px solid #FF2E9A}
.fr .c3{left:0;bottom:0;border-left:1.5px solid #FF2E9A;border-bottom:1.5px solid #FF2E9A}
.fr .c4{right:0;bottom:0;border-right:1.5px solid #22E0FF;border-bottom:1.5px solid #22E0FF}

.lg{position:absolute;left:26px;top:26px;z-index:5;line-height:.98;pointer-events:none}
.lg b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;color:#fff;
  text-shadow:0 0 14px rgba(120,225,255,.6)}
.lg i{display:block;font-style:normal;font-size:19px;font-weight:800;letter-spacing:-.4px;
  color:#FF2E9A;text-shadow:0 0 16px rgba(255,46,154,.8)}

.W{position:absolute;left:26px;top:238px;z-index:5;pointer-events:none}
.W b{display:block;font-size:23px;font-weight:800;letter-spacing:1.2px;line-height:1;
  transition:color .35s,text-shadow .35s}
.W span{display:block;margin-top:6px;font-size:7.5px;font-weight:700;letter-spacing:2.2px;
  text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 2px 9px rgba(0,0,0,.9)}

/* Yalniz semboller. Alti adi 320 piksele yan yana dizmek denendi, her ad
   46 piksele dusup kirpiliyordu; secili gezegenin adi zaten ustte duruyor. */
.T{position:absolute;left:16px;right:16px;top:314px;z-index:6;display:flex;
  justify-content:space-between;pointer-events:auto}
.t{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid transparent;transition:border-color .2s,background .2s}
.t svg{width:20px;height:20px;display:block;opacity:.44;transition:opacity .2s}
.t.on{background:rgba(255,255,255,.06)}
.t.on svg{opacity:1}

/* Sayac ile dugme ust uste biniyordu: "120" rakaminin isimasi CTA'nin ust
   kenarina tasip bulanik bir bant birakiyordu. */
.st{position:absolute;left:16px;right:16px;top:362px;z-index:6;
  display:flex;align-items:baseline;gap:8px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.12);pointer-events:none}
.st b{font-size:25px;font-weight:800;letter-spacing:-.8px;color:#22E0FF;
  text-shadow:0 0 14px rgba(34,224,255,.55)}
.st span{font-size:8px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,.44)}

.cta{position:absolute;left:16px;right:16px;bottom:20px;z-index:7;
  background:#22E0FF;color:#04212B;border:0;
  font:800 11.5px/1 -apple-system,'Segoe UI',Arial;letter-spacing:1.9px;text-transform:uppercase;
  padding:14px 10px;border-radius:999px;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 22px rgba(34,224,255,.45);transition:background .2s}
.cta:hover{background:#fff}

.hint{position:absolute;right:16px;top:26px;z-index:8;font-size:7px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.42);
  pointer-events:none;transition:opacity .4s}
.hint.h{opacity:0}
.adv{position:absolute;left:8px;bottom:5px;z-index:9;font-size:7px;font-weight:600;
  letter-spacing:1.3px;color:rgba(255,255,255,.26)}
@media(prefers-reduced-motion:reduce){.S .im,.t,.W b{transition:none}}
</style></head><body>
