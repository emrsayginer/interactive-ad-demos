<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>KORVAL 728x90 &mdash; Where the sun lands</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:728px;height:90px;overflow:hidden;background:#1C2028;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:728px;height:90px;overflow:hidden;cursor:pointer;
  background:#1C2028;color:#EDE8DC;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}


.lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:9.450000000000001px;height:9.450000000000001px;border:1.5px solid #F5B65A;transform:rotate(45deg);display:block}
.lg b{font-size:10.5px;font-weight:800;letter-spacing:3.36px;color:#EDE8DC}
.lg span{font-size:8.4px;color:#8A8F9B;letter-spacing:.5px}

.cta{display:inline-block;background:#F5B65A;color:#1C2028;border:0;border-radius:2px;cursor:pointer;
  font:800 9px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.6199999999999999px;text-transform:uppercase;padding:9px 15px;
  transition:background .2s,color .2s;white-space:nowrap}
.cta:hover{background:#EDE8DC}

.plan{display:block;touch-action:none;cursor:grab}
.plan:active{cursor:grabbing}
.plan .yay{fill:none;stroke:#5A606C;stroke-width:1;stroke-dasharray:2 4}
.plan .odalar rect{fill:#252A34;stroke:#D9D3C4}
.plan .odalar .balkon{fill:none;stroke-dasharray:3 3}
.plan .isik rect{opacity:0;transition:opacity .25s;pointer-events:none}
.plan .pencere path{stroke:#F5B65A;stroke-linecap:round}
.plan .pl{fill:#8A8F9B;font:600 var(--fs) -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;pointer-events:none}
.plan #SUN{fill:#F5B65A;filter:drop-shadow(0 0 6px rgba(245,182,90,.75))}
.plan .st{fill:#F5B65A;font:700 var(--fs) -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;text-anchor:middle;pointer-events:none}

.K{position:absolute;inset:0;display:flex;align-items:center;gap:18px;padding:0 18px 0 20px}
.L{flex:none;width:178px}
h1{margin-top:4px;font-size:13.5px;line-height:1.1;font-weight:300;letter-spacing:-.2px}
.M{flex:none;display:flex;align-items:center;gap:14px}
.ray{position:relative;width:150px;height:44px;cursor:grab;touch-action:none}
.ray .cz2{position:absolute;left:0;right:0;top:20px;height:2px;background:#5A606C}
.ray .tk{position:absolute;top:26px;font-size:7px;color:#8A8F9B;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.ray .sun{position:absolute;top:21px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#F5B65A;
  box-shadow:0 0 8px rgba(245,182,90,.8);transition:left .05s linear}
.ray .sun b{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:8px;font-weight:700;color:#F5B65A;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.Rt{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:0}
.cum{font-size:10.5px;color:#F5B65A;text-align:right;line-height:1.25;max-width:150px}
.cta{flex:none;pointer-events:auto}

.adv{position:absolute;left:20px;bottom:2px;
  font-size:6px;font-weight:600;letter-spacing:1.2px;color:#5A606C;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="K">
  <div class="L"><div class="lg"><i></i><b>KORVAL</b><span>Homes</span></div><h1>Where the sun lands, hour by hour.</h1></div>
  <div class="M">
    <svg class="plan" width="84" height="63" viewBox="0 0 84 63" data-kontrol="1" id="PLAN" style="--fs:6.0px"><defs><linearGradient id="gS" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2B266"/><stop offset="1" stop-color="#F2B266" stop-opacity="0"/></linearGradient><linearGradient id="gE" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F2B266"/><stop offset="1" stop-color="#F2B266" stop-opacity="0"/></linearGradient></defs><g class="odalar" stroke-width="1.00"><rect x="0.0" y="0.0" width="33.6" height="29.4" /><rect x="33.6" y="0.0" width="50.4" height="29.4" /><rect x="0.0" y="29.4" width="58.8" height="25.2" /><rect x="58.8" y="29.4" width="25.2" height="33.6" /><rect x="0.0" y="54.6" width="58.8" height="8.4" class="balkon"/></g><g class="isik"><rect x="33.6" y="0.0" width="50.4" height="29.4" id="oB" fill="url(#gE)"/><rect x="0.0" y="29.4" width="58.8" height="25.2" id="oL" fill="url(#gS)"/><rect x="0.0" y="54.6" width="58.8" height="8.4" id="oBal" fill="#F2B266"/></g><g class="pencere" stroke-width="2.20"><path d="M 6.3 0.0 L 27.3 0.0"/><path d="M 84.0 6.3 L 84.0 23.1"/><path d="M 8.4 54.6 L 50.4 54.6"/></g></svg>
    <div class="ray" id="RAYK" data-kontrol="1">
      <div class="cz2"></div>
      <span class="tk" style="left:0">07:00</span><span class="tk" style="left:50%;transform:translateX(-50%)">13:00</span><span class="tk" style="right:0">19:00</span>
      <div class="sun" id="RAY"><b id="CUMS"></b></div>
    </div>
  </div>
  <div class="Rt"><div class="cum" id="CUM"></div><button class="cta" data-cta="1">View listing</button></div>
</div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "https://example.com/korval-flat-4b";

var ODA = [
  { k: "living",  ad: "Living room", yon: 180 },
  { k: "bedroom", ad: "Bedroom",     yon: 90 },
  { k: "kitchen", ad: "Kitchen",     yon: 0 }
];
function gunes(t) { var f = (t - 7) / 12; return { az: 90 + f * 180, yuk: Math.sin(f * Math.PI) }; }
function isik(yon, g) { var d = (g.az - yon) * Math.PI / 180; return Math.max(0, Math.cos(d)) * g.yuk; }
function saat(t) {
  var h = Math.floor(t), m = Math.round((t - h) * 60);
  if (m === 60) { h++; m = 0; }
  return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
function cumle(t) {
  var g = gunes(t), en = null, enV = 0;
  ODA.forEach(function (o) { var v = isik(o.yon, g); if (v > enV) { enV = v; en = o; } });
  if (!en || enV < .12) return "No direct sun at " + saat(t) + ".";
  var d = enV > .7 ? "in full sun" : enV > .4 ? "in the sun" : "in soft light";
  return en.ad + " " + d + " at " + saat(t) + ".";
}
/* Bir odanin gun icinde gunes aldigi aralik: 07:00-19:00 dakika dakika taranir. */
function aralik(yon) {
  var a = null, b = null;
  for (var t = 7; t <= 19.0001; t += 1 / 60) {
    if (isik(yon, gunes(t)) > .12) { if (a === null) a = t; b = t; }
  }
  return a === null ? null : [a, b];
}

var PLAN = document.getElementById("PLAN"), SUN = document.getElementById("SUN"), ST = document.getElementById("ST"),
    oB = document.getElementById("oB"), oL = document.getElementById("oL"), oBal = document.getElementById("oBal"),
    CUM = document.getElementById("CUM"), CZ = document.getElementById("CZ"), RAY = document.getElementById("RAY");
var S = 0.42, R = 135, OX = 0, OY = 0;
var t = 15.5, dokunuldu = false, sonT = 0, yon = 1;

if (CZ) {
  ODA.forEach(function (od) {
    var a = aralik(od.yon), r = document.createElement("div");
    r.className = "r";
    r.innerHTML = '<div class="n"><span>' + od.ad + '</span><b>' + (a ? saat(a[0]) + "\u2013" + saat(a[1]) : "no direct sun") + '</b></div>'
      + '<div class="bar">' + (a ? '<i style="left:' + ((a[0] - 7) / 12 * 100).toFixed(1) + '%;right:' + ((19 - a[1]) / 12 * 100).toFixed(1) + '%"></i>' : '') + '<s></s></div>';
    CZ.appendChild(r);
  });
}
var imlec = CZ ? CZ.querySelectorAll("s") : [];

function ciz() {
  var g = gunes(t);
  oB.style.opacity = (isik(90, g) * .85).toFixed(3);
  var l = isik(180, g);
  oL.style.opacity = (l * .8).toFixed(3);
  oBal.style.opacity = (l * .55).toFixed(3);
  if (SUN) {
    var a = g.az * Math.PI / 180;
    var x = OX + 100 * S + R * S * Math.sin(a), y = OY + 75 * S - R * S * Math.cos(a);
    SUN.setAttribute("cx", x.toFixed(1)); SUN.setAttribute("cy", y.toFixed(1));
    /* saat etiketi gunesin DISINA: yorungenin disina dogru 13 birim. */
    ST.setAttribute("x", (x + 13 * S * Math.sin(a)).toFixed(1));
    ST.setAttribute("y", (y - 13 * S * Math.cos(a) + 3).toFixed(1));
    ST.textContent = saat(t);
  }
  if (RAY) RAY.style.left = ((t - 7) / 12 * 100).toFixed(2) + "%";
  if (CUM) CUM.textContent = cumle(t);
  var p = ((t - 7) / 12 * 100).toFixed(2) + "%";
  for (var i = 0; i < imlec.length; i++) imlec[i].style.left = p;
}

/* Surukleme: isaretcinin plan merkezine gore acisi azimut, azimut saat. */
function acidan(e) {
  var b = PLAN.getBoundingClientRect();
  var dx = e.clientX - b.left - (OX + 100 * S), dy = e.clientY - b.top - (OY + 75 * S);
  var az = Math.atan2(dx, -dy) * 180 / Math.PI; if (az < 0) az += 360;
  az = Math.max(90, Math.min(270, az));
  return 7 + (az - 90) / 180 * 12;
}

var RAYK = document.getElementById("RAYK");
function raydan(e) {
  var b = RAYK.getBoundingClientRect();
  return 7 + Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)) * 12;
}
function tut(el, fn) {
  var basili = false;
  el.addEventListener("pointerdown", function (e) { basili = true; dokunuldu = true; el.setPointerCapture(e.pointerId); t = fn(e); ciz(); });
  el.addEventListener("pointermove", function (e) { if (basili) { t = fn(e); ciz(); } });
  el.addEventListener("pointerup", function () { basili = false; });
  el.addEventListener("pointercancel", function () { basili = false; });
}
tut(RAYK, raydan);

/* Dokunulmadan once gunes kendi kendine gidip geliyor: banner olu durmasin,
   mekanik ilk saniyede anlasilsin. Ilk dokunusta durur. */
function dongu(z) {
  if (!dokunuldu) {
    if (!sonT) sonT = z;
    var dt = Math.min(50, z - sonT); sonT = z;
    t += yon * dt / 1000 * 1.1;
    if (t > 19) { t = 19; yon = -1; } else if (t < 7) { t = 7; yon = 1; }
    ciz();
  }
  requestAnimationFrame(dongu);
}
ciz();
requestAnimationFrame(dongu);

var CUMS = document.getElementById("CUMS");
(function () { var eski = ciz; ciz = function () { eski(); CUMS.textContent = saat(t); }; ciz(); })();
/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
