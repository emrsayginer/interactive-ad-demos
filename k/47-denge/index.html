<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>BALANTO 300x250 &mdash; Keep it level</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:300px;height:250px;overflow:hidden;background:#0E1B1A;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;color:#E7F5F0;
  background:linear-gradient(180deg,#14322E 0%,#0E1B1A 100%);
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit;border:0;background:none}

.mesh{position:absolute;inset:0;background:
  radial-gradient(130% 90% at 8% -10%,#0E4A3E 0%,transparent 55%),
  radial-gradient(120% 90% at 105% 105%,#123A5C 0%,transparent 55%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>')}

.top{position:absolute;left:14px;top:10px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:8}
.lg{display:flex;align-items:center;gap:6px}
.lg b{font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  background:linear-gradient(90deg,#E7F5F0,#38D9A9);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg i{width:4px;height:4px;border-radius:50%;background:#38D9A9;box-shadow:0 0 6px rgba(56,217,169,.8);display:block}
.step{font-size:8px;font-weight:700;letter-spacing:.4px;color:rgba(231,245,240,.5)}
.adv{position:absolute;right:14px;top:26px;font-size:6px;font-weight:700;letter-spacing:1px;
  color:rgba(231,245,240,.35);text-transform:uppercase;pointer-events:none;z-index:5}

.stage{position:absolute;left:0;right:0;top:34px;bottom:38px}
.chip{position:absolute;left:50%;top:0;width:66px;margin-left:-33px;padding:8px 6px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(56,217,169,.4);border-radius:8px;text-align:center;
  font-size:12px;font-weight:800;color:#6BF0A6;touch-action:none;pointer-events:auto;z-index:6;
  box-shadow:0 0 16px rgba(56,217,169,.35)}
.beam-wrap{position:absolute;left:50%;top:96px;width:180px;margin-left:-90px;height:8px}
.beam{position:absolute;left:0;top:0;width:100%;height:4px;border-radius:2px;
  background:linear-gradient(90deg,#38D9A9,#6BF0A6);box-shadow:0 0 8px rgba(56,217,169,.6);
  transform-origin:50% 50%;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pivot{position:absolute;left:50%;top:100px;width:0;height:0;margin-left:-7px;
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid rgba(56,217,169,.5)}
.pan{position:absolute;bottom:6px;width:64px;height:30px;border:1.5px dashed rgba(56,217,169,.4);
  border-radius:6px 6px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pan.left{left:16px}
.pan.right{right:16px}
.pan b{font-size:12px;color:#6BF0A6}
.pan span{font-size:7px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:rgba(231,245,240,.55)}
.msg{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:10px;font-weight:700;
  color:rgba(231,245,240,.8);z-index:2}

.alt{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;background:linear-gradient(180deg,rgba(14,27,26,0),rgba(14,27,26,.85) 40%)}
.msj{font-size:9.5px;font-weight:600;color:rgba(231,245,240,.9)}
.cta{background:linear-gradient(135deg,#8CFFCB,#38D9A9);color:#0E1B1A;font-size:9px;font-weight:800;border-radius:13px;
  padding:8px 13px;letter-spacing:.4px;text-transform:uppercase;pointer-events:auto;white-space:nowrap;
  box-shadow:0 2px 10px rgba(56,217,169,.4),0 0 0 1px rgba(255,255,255,.25) inset}
@media(prefers-reduced-motion:reduce){.beam{transition:none!important}}
</style></head><body>
<div id="R">
<div class="mesh"></div>
<div class="grain"></div>

<div class="top"><div class="lg"><b>balanto</b><i></i></div><div class="step" id="STEPLBL">1 of 4</div></div>
<div class="adv">Advertisement</div>

<div class="stage" id="STAGE" data-kontrol="1">
  <div class="msg" id="MSG">Drag each amount to Save or Spend</div>
  <div class="chip" id="CHIP">$40</div>
  <div class="pivot"></div>
  <div class="beam-wrap"><div class="beam" id="BEAM"></div></div>
  <div class="pan left" id="PANL"><b id="SUML">$0</b><span>Save</span></div>
  <div class="pan right" id="PANR"><b id="SUMR">$0</b><span>Spend</span></div>
</div>

<div class="alt">
  <div class="msj">See where your money goes</div>
  <button class="cta" data-cta="1">Get your free budget plan</button>
</div>
</div>
<script>
var clickTag = "../../landing.html?b=balanto";

var CHIPS = [40, 10, 30, 20];
var AUTO_SIDE = ["left", "left", "right", "right"];
var STAGE = document.getElementById("STAGE"), CHIP = document.getElementById("CHIP"),
    MSG = document.getElementById("MSG"), STEPLBL = document.getElementById("STEPLBL"),
    BEAM = document.getElementById("BEAM"), PANL = document.getElementById("PANL"),
    PANR = document.getElementById("PANR"), SUML = document.getElementById("SUML"),
    SUMR = document.getElementById("SUMR");

var idx = 0, sumL = 0, sumR = 0, dragging = false, resolved = false, autoT = null;

function renderChip() {
  resolved = false;
  CHIP.style.transition = "none";
  CHIP.style.left = "50%"; CHIP.style.top = "0"; CHIP.style.marginLeft = "-33px";
  CHIP.style.opacity = "1";
  void CHIP.offsetWidth;
  CHIP.style.transition = "";
  CHIP.textContent = "$" + CHIPS[idx];
  CHIP.style.display = "";
  STEPLBL.textContent = (idx + 1) + " of " + CHIPS.length;
  clearTimeout(autoT);
  autoT = setTimeout(function () { if (!dragging) autoAssign(); }, 1100);
}
function updateBeam() {
  var diff = sumR - sumL;
  var angle = Math.max(-12, Math.min(12, diff / 4));
  BEAM.style.transform = "rotate(" + angle + "deg)";
}
function assign(side) {
  if (resolved) return;
  resolved = true;
  var v = CHIPS[idx];
  if (side === "left") { sumL += v; SUML.textContent = "$" + sumL; PANL.style.background = "rgba(56,217,169,.12)"; }
  else { sumR += v; SUMR.textContent = "$" + sumR; PANR.style.background = "rgba(56,217,169,.12)"; }
  updateBeam();
  CHIP.style.display = "none";
  setTimeout(function () { PANL.style.background = ""; PANR.style.background = ""; next(); }, 260);
}
function autoAssign() { assign(AUTO_SIDE[idx]); }
function next() {
  idx++;
  if (idx < CHIPS.length) renderChip();
  else finish();
}
function finish() {
  var diff = Math.abs(sumR - sumL);
  MSG.textContent = diff <= 5 ? "Balanced — nice work" : ("$" + diff + " off — see your plan");
  STEPLBL.textContent = "Done";
}

function rectContains(rect, x, y) {
  return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
}
var dragOffX = 0, dragOffY = 0;
CHIP.addEventListener("pointerdown", function (e) {
  if (resolved) return;
  clearTimeout(autoT);
  dragging = true;
  CHIP.style.transition = "none";
  var r = CHIP.getBoundingClientRect();
  dragOffX = e.clientX - r.left; dragOffY = e.clientY - r.top;
  if (e.pointerId != null && e.target.setPointerCapture) { try { e.target.setPointerCapture(e.pointerId); } catch (err) {} }
});
CHIP.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var stageRect = STAGE.getBoundingClientRect();
  var x = e.clientX - stageRect.left - dragOffX, y = e.clientY - stageRect.top - dragOffY;
  CHIP.style.left = x + "px"; CHIP.style.top = y + "px"; CHIP.style.marginLeft = "0";
});
CHIP.addEventListener("pointerup", function (e) {
  if (!dragging) return;
  dragging = false;
  var overL = rectContains(PANL.getBoundingClientRect(), e.clientX, e.clientY);
  var overR = rectContains(PANR.getBoundingClientRect(), e.clientX, e.clientY);
  if (overL) assign("left");
  else if (overR) assign("right");
  else renderChip();
});

renderChip();

(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
