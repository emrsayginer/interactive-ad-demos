<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=970,height=250">
<title>Neon Star Shooter 970x250 &mdash; Pick a planet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{width:970px;height:250px;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
.b{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;background:#05060E;
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff}

/* ---------------------------------------------------------------------------
   SAHNE KATMANI

   Iki katman var ve aralarinda gecis yapiliyor. Tek katmanda src degistirmek
   denendi: veri URI'si oldugu icin resim aninda geliyor ama gecis SERT
   oluyor, gezegen degistirmek "bozuldu mu" hissi veriyordu. Iki katman +
   opaklik gecisi ayni bayt sayisiyla yumusak bir gecis veriyor.
--------------------------------------------------------------------------- */
.S{position:absolute;left:300px;top:0;width:670px;height:100%;overflow:hidden}
.S .im{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .45s ease}
.S .im.on{opacity:1}
/* Sol kenar karartmasi: sahne panelin icine akiyor, sert bir dikey kesik
   banner'i iki ayri resme boluyordu. */
.S::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#05060E 0%,rgba(5,6,14,.60) 8%,rgba(5,6,14,0) 26%),
             linear-gradient(0deg,rgba(5,6,14,.74) 0%,rgba(5,6,14,.16) 20%,rgba(5,6,14,0) 40%)}

/* padding-bottom dikeyde ortalanan blogu yukari itiyor: PLAY FREE dugmesinin
   sol alt kosesi ile ADVERTISEMENT etiketi ust uste biniyordu. */
.L{position:absolute;left:0;top:0;width:310px;height:100%;z-index:5;padding:26px 26px 24px 30px;
  display:flex;flex-direction:column;justify-content:center;pointer-events:none}
/* Oyunun kendi baslik muamelesi: beyaz "Neon", magenta "Star Shooter",
   ikisi de isimali. */
.lg{line-height:.95}
.lg b{display:block;font-size:27px;font-weight:800;letter-spacing:-.6px;color:#fff;
  text-shadow:0 0 16px rgba(120,225,255,.55)}
.lg i{display:block;margin-top:2px;font-style:normal;font-size:27px;font-weight:800;
  letter-spacing:-.6px;color:#FF2E9A;text-shadow:0 0 18px rgba(255,46,154,.75)}
.tag{margin-top:13px;font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.62);max-width:236px}
.big{margin-top:12px;display:flex;align-items:baseline;gap:7px}
.big b{font-size:25px;font-weight:800;letter-spacing:-.8px;color:#22E0FF;
  text-shadow:0 0 14px rgba(34,224,255,.6)}
.big span{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.42)}
.cta{margin-top:16px;align-self:flex-start;background:#22E0FF;color:#04212B;border:0;
  font:800 11px/1 -apple-system,'Segoe UI',Arial;letter-spacing:1.8px;text-transform:uppercase;
  padding:12px 24px;border-radius:999px;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 22px rgba(34,224,255,.5);transition:background .2s,box-shadow .2s}
.cta:hover{background:#fff;box-shadow:0 0 28px rgba(255,255,255,.6)}

/* Sahne uzerindeki dunya etiketi */
.W{position:absolute;left:326px;top:28px;z-index:6;pointer-events:none}
.W b{display:block;font-size:29px;font-weight:800;letter-spacing:1.4px;line-height:1;
  transition:color .35s,text-shadow .35s}
.W span{display:block;margin-top:7px;font-size:8.5px;font-weight:700;letter-spacing:2.4px;
  text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 2px 9px rgba(0,0,0,.9)}

/* ---------------------------------------------------------------------------
   GEZEGEN SEKMELERI

   Oyunun ana menusundeki secici, reklamin icinde. Alicinin ilk sorusu
   "bu oyunda ne var" -- altisini da acilis sayfasina birakmak yerine
   burada gosteriyoruz. Sekmeler sahnenin ALTINA, karartilmis serit
   uzerine oturuyor; sahnenin ortasina koymak resmi kapatiyordu.
--------------------------------------------------------------------------- */
.T{position:absolute;left:300px;right:0;bottom:0;height:38px;z-index:7;display:flex;
  background:rgba(4,5,12,.62);border-top:1px solid rgba(255,255,255,.10)}
.t{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;pointer-events:auto;font-size:8.5px;font-weight:700;letter-spacing:1.9px;
  text-transform:uppercase;color:rgba(255,255,255,.46);transition:color .2s}
/* Duz renkli nokta yerine gezegenin KENDI sembolu. Alti nokta yan yana
   dizilince tek ayirt edici sey renk kaliyordu; renk korlugu bir yana,
   uzaktan bakan biri alti ayni daire goruyor. Sembol, gezegeni adini
   okumadan da ayirt ediyor. */
.t svg{width:13px;height:13px;display:block;flex:none;opacity:.5;transition:opacity .2s}
.t.on svg{opacity:1}
/* Alt cizgi gezegenin RENGI. currentColor kullanilmisti ama secili sekmenin
   metni beyaz oldugu icin cizgi de beyaz cikiyor, alti gezegeni birbirinden
   ayiran tek sinyal kayboluyordu. */
.t::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;
  background:var(--c);opacity:0;transition:opacity .2s}
.t.on{color:#fff}
.t.on::after{opacity:1}

/* ---------------------------------------------------------------------------
   KOSE AYRACLARI

   Oyunun kendi menusunde hangar karti bu ayraclarla cerceveleniyor (sol ust
   ve sag alt camgobegi, digerleri magenta). Reklam oyunun arayuzunden bir
   isaret tasimazsa "oyunun goruntusu uzerine yazilmis bir banner" gibi
   duruyor; ayraclar onu oyunun kendi dilinin parcasi yapiyor.
--------------------------------------------------------------------------- */
.fr{position:absolute;left:316px;top:15px;right:15px;bottom:52px;z-index:6;pointer-events:none}
.fr b{position:absolute;width:15px;height:15px;display:block;opacity:.85}
.fr .c1{left:0;top:0;border-left:1.5px solid #22E0FF;border-top:1.5px solid #22E0FF}
.fr .c2{right:0;top:0;border-right:1.5px solid #FF2E9A;border-top:1.5px solid #FF2E9A}
.fr .c3{left:0;bottom:0;border-left:1.5px solid #FF2E9A;border-bottom:1.5px solid #FF2E9A}
.fr .c4{right:0;bottom:0;border-right:1.5px solid #22E0FF;border-bottom:1.5px solid #22E0FF}

.hint{position:absolute;right:16px;top:32px;z-index:8;font-size:8px;font-weight:700;
  letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.40);
  pointer-events:none;transition:opacity .4s}
.hint.h{opacity:0}
.adv{position:absolute;left:8px;bottom:6px;z-index:9;font-size:7px;font-weight:600;
  letter-spacing:1.3px;color:rgba(255,255,255,.26)}
@media(prefers-reduced-motion:reduce){.S .im,.t,.W b{transition:none}}
</style></head><body>
