.kd .sn{transform-origin:100px 100px;transform-box:view-box;animation:sn 60s linear infinite}

.kd.gece .ix{stroke:#CFEFD9;filter:drop-shadow(0 0 2.5px #CFEFD9)}

82.1" y2="184.1" class="im"/><line x1="74.4" y1="178.9" x2="73.4" y2="181.8" class="im"/><line x1="66.2" y1="175.8" x2="65.0" y2="178.6" class="im"/><line x1="61.0" y1="167.5" x2="57.0" y2="174.5" class="ix"/><line x1="51.2" y1="167.1" x2="49.5" y2="169.6" class="im"/><line x1="44.5" y1="161.7" x2="42.5" y2="163.9" class="im"/><line x1="38.3" y1="155.5" x2="36.1" y2="157.5" class="im"/><line x1="32.9" y1="148.8" x2="30.4" y2="150.5" class="im"/><line x1="32.5" y1="139.0" x2="25.5" y2="143.0" class="ix"/><line x1="24.2" y1="133.8" x2="21.4" y2="135.0" class="im"/><line x1="21.1" y1="125.6" x2="18.2" y2="126.6" class="im"/><line x1="18.8" y1="117.3" x2="15.9" y2="117.9" class="im"/><line x1="17.5" y1="108.7" x2="14.5" y2="109.0" class="im"/><line x1="22.0" y1="100.0" x2="14.0" y2="100.0" class="ix"/><line x1="17.5" y1="91.3" x2="14.5" y2="91.0" class="im"/><line x1="18.8" y1="82.7" x2="15.9" y2="82.1" class="im"/><line x1="21.1" y1="74.4" x2="18.2" y2="73.4" class="im"/><line x1="24.2" y1="66.2" x2="21.4" y2="65.0" class="im"/><line x1="32.5" y1="61.0" x2="25.5" y2="57.0" class="ix"/><line x1="32.9" y1="51.2" x2="30.4" y2="49.5" class="im"/><line x1="38.3" y1="44.5" x2="36.1" y2="42.5" class="im"/><line x1="44.5" y1="38.3" x2="42.5" y2="36.1" class="im"/><line x1="51.2" y1="32.9" x2="49.5" y2="30.4" class="im"/><line x1="61.0" y1="32.5" x2="57.0" y2="25.5" class="ix"/><line x1="66.2" y1="24.2" x2="65.0" y2="21.4" class="im"/><line x1="74.4" y1="21.1" x2="73.4" y2="18.2" class="im"/><line x1="82.7" y1="18.8" x2="82.1" y2="15.9" class="im"/><line x1="91.3" y1="17.5" x2="91.0" y2="14.5" class="im"/></g>
  <text x="100" y="62" text-anchor="middle" class="mk">VELMOR</text>

<script>
var clickTag = "../../landing.html?b=velmor-meridian";

/* Isik tablosu: [dakika, renk, alfa, aci]. Aci gunes gibi dolasir: sabah
   sol-ust, ogle ust, aksam sag-ust; gece isik yok, lum devrede. */
var ISIK = [
  [300, "#C9A96A", 0.00, -70], [390, "#E1B76F", 0.62, -55], [540, "#F3E4C2", 0.55, -25],
  [720, "#FFFFFF", 0.42, 0], [900, "#F3D9A6", 0.55, 25], [1080, "#D98F4C", 0.60, 58],
  [1200, "#5B6C9C", 0.22, 75], [1260, "#5B6C9C", 0.00, 80]
];
var SATIR = [
  [5, "Midnight. Only the lume, and the time."],
  [8, "First light. The gold warms before the room does."],
  [11, "Morning. The sapphire flat, the dial quiet."],
  [14, "Noon. Nothing to prove, nothing to hide."],
  [17, "Afternoon. The hands keep their own counsel."],
  [20, "Dusk. The bezel catches what is left of the day."],
  [23, "Evening. Lume rises as the light goes."],
  [24, "Midnight. Only the lume, and the time."]
];
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function kar(a, b, t) { return Math.round(a + (b - a) * t); }
function isik(dk) {
  if (dk < ISIK[0][0] || dk > ISIK[ISIK.length - 1][0]) return { renk: "#5B6C9C", alfa: 0, aci: 0 };
  for (var i = 1; i < ISIK.length; i++) {
    if (dk <= ISIK[i][0]) {
      var A = ISIK[i - 1], B = ISIK[i], t = (dk - A[0]) / (B[0] - A[0]);
      var a = hex(A[1]), b = hex(B[1]);
      return { renk: "rgb(" + kar(a[0], b[0], t) + "," + kar(a[1], b[1], t) + "," + kar(a[2], b[2], t) + ")",
               alfa: A[2] + (B[2] - A[2]) * t, aci: A[3] + (B[3] - A[3]) * t };
    }
  }
}
function satir(dk) { var h = dk / 60; for (var i = 0; i < SATIR.length; i++) if (h < SATIR[i][0]) return SATIR[i][1]; return SATIR[0][1]; }
function saat(dk) { var h = Math.floor(dk / 60) % 24, m = Math.floor(dk % 60); return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function gece(dk) { return dk < 330 || dk >= 1230; }

var KD = document.querySelector(".kd"), EL = document.getElementById("EL"), ED = document.getElementById("ED"),
    S0 = document.getElementById("s0"), S1 = document.getElementById("s1"), GR = document.getElementById("isik");
var SA = document.getElementById("SA"), CUM = document.getElementById("CUM");
var dk = 608, dokunuldu = false, sonT = 0;

function ciz() {
  dk = ((dk % 1440) + 1440) % 1440;
  var hs = (dk % 720) / 720 * 360, ms = (dk % 60) / 60 * 360;
  EL.style.transform = "rotate(" + hs + "deg)";
  ED.style.transform = "rotate(" + ms + "deg)";
  var L = isik(dk), r = 96, a = L.aci * Math.PI / 180;
  GR.setAttribute("cx", (100 + r * Math.sin(a)).toFixed(1));
  GR.setAttribute("cy", (100 - r * Math.cos(a)).toFixed(1));
  S0.setAttribute("stop-color", L.renk); S0.setAttribute("stop-opacity", L.alfa.toFixed(3));
  S1.setAttribute("stop-color", L.renk);
  KD.classList.toggle("gece", gece(dk));
  if (SA) SA.textContent = saat(dk);
  if (CUM) CUM.textContent = satir(dk);
}
function ayarla(v) { dokunuldu = true; dk = v; ciz(); }

/* Surukleme: aci farki toplanir, iki tur bir gun. */
var onceki = null;
function aci(e) {
  var b = KD.getBoundingClientRect();
  return Math.atan2(e.clientX - (b.left + b.width / 2), -(e.clientY - (b.top + b.height / 2)));
}
KD.addEventListener("pointerdown", function (e) {
  dokunuldu = true; onceki = aci(e);
  try { KD.setPointerCapture(e.pointerId); } catch (x) {}
});
KD.addEventListener("pointermove", function (e) {
  if (onceki === null) return;
  var a = aci(e), d = a - onceki;
  if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
  onceki = a;
  dk += d / (2 * Math.PI) * 720;
  ciz();
});
KD.addEventListener("pointerup", function () { onceki = null; });
KD.addEventListener("pointercancel", function () { onceki = null; });

/* Dokunulana kadar saat ilerler: 1 saat ~ 1.3 sn, gun 31 sn. */
function dongu(z) {
  if (!dokunuldu) {
    if (!sonT) sonT = z;
    var dt = Math.min(50, z - sonT); sonT = z;
    dk += dt / 1000 * 46;
    ciz();
  }
  requestAnimationFrame(dongu);
}
ciz();
requestAnimationFrame(dongu);

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
