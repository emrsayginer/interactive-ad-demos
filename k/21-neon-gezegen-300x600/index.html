<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=600">
<title>Neon Star Shooter 300x600 &mdash; Pick a planet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{width:300px;height:600px;overflow:hidden;background:#000;-webkit-font-smoothing:antialiased}
.b{position:relative;width:300px;height:600px;overflow:hidden;cursor:pointer;background:#05060E;
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff}

.S{position:absolute;left:0;top:0;width:300px;height:330px;overflow:hidden}
.S .im{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .45s ease}
.S .im.on{opacity:1}
.S::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,#05060E 0%,rgba(5,6,14,.62) 18%,rgba(5,6,14,0) 42%,
             rgba(5,6,14,.36) 90%,rgba(5,6,14,.60) 100%)}

.fr{position:absolute;left:14px;top:14px;right:14px;height:302px;z-index:4;pointer-events:none}
.fr b{position:absolute;width:14px;height:14px;display:block;opacity:.85}
.fr .c1{left:0;top:0;border-left:1.5px solid #22E0FF;border-top:1.5px solid #22E0FF}
.fr .c2{right:0;top:0;border-right:1.5px solid #FF2E9A;border-top:1.5px solid #FF2E9A}
.fr .c3{left:0;bottom:0;border-left:1.5px solid #FF2E9A;border-bottom:1.5px solid #FF2E9A}
.fr .c4{right:0;bottom:0;border-right:1.5px solid #22E0FF;border-bottom:1.5px solid #22E0FF}

.lg{position:absolute;left:26px;top:26px;z-index:5;line-height:.98;pointer-events:none}
.lg b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;color:#fff;
  text-shadow:0 0 14px rgba(120,225,255,.6)}
.lg i{display:block;font-style:normal;font-size:20px;font-weight:800;letter-spacing:-.4px;
  color:#FF2E9A;text-shadow:0 0 16px rgba(255,46,154,.8)}

.W{position:absolute;left:26px;bottom:0;z-index:5;pointer-events:none}
.W b{display:block;font-size:24px;font-weight:800;letter-spacing:1.2px;line-height:1;
  transition:color .35s,text-shadow .35s}
.W span{display:block;margin-top:6px;font-size:7.5px;font-weight:700;letter-spacing:2.2px;
  text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 2px 9px rgba(0,0,0,.9)}
/* .Wb'nin konum baglami .b idi, yani "bottom:16px" 600 pikselin dibi demekti:
   dunya adi sahnenin altinda degil, CTA'nin uzerinde beliriyordu. Blok artik
   sahnenin alt kenarina sabitli. */
.Wb{position:absolute;left:0;right:0;top:250px;height:64px;z-index:5}

/* ---------------------------------------------------------------------------
   GEZEGEN IZGARASI

   Uc yuz pikselde alti sekmeyi tek satira dizmek denendi: her biri 50 piksele
   dusuyor ve "TARTAROS" sigmiyordu. Uce iki izgara hem adi hem sembolu tam
   gosteriyor; ustelik oyunun kendi menusundeki kart dizilimine benziyor.
--------------------------------------------------------------------------- */
.G{position:absolute;left:16px;right:16px;top:346px;z-index:6;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{height:58px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;pointer-events:auto;transition:border-color .2s,background .2s}
.g svg{width:17px;height:17px;display:block;opacity:.55;transition:opacity .2s}
.g span{font-size:7.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.48);transition:color .2s}
.g.on{background:rgba(255,255,255,.07)}
.g.on svg{opacity:1}
.g.on span{color:#fff}

.st{position:absolute;left:16px;right:16px;top:474px;z-index:6;
  display:flex;align-items:baseline;gap:8px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.12);pointer-events:none}
.st b{font-size:26px;font-weight:800;letter-spacing:-.8px;color:#22E0FF;
  text-shadow:0 0 14px rgba(34,224,255,.55)}
.st span{font-size:8.5px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;
  color:rgba(255,255,255,.44)}

.cta{position:absolute;left:16px;right:16px;bottom:26px;z-index:7;
  background:#22E0FF;color:#04212B;border:0;
  font:800 11.5px/1 -apple-system,'Segoe UI',Arial;letter-spacing:1.9px;text-transform:uppercase;
  padding:14px 10px;border-radius:999px;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 22px rgba(34,224,255,.45);transition:background .2s}
.cta:hover{background:#fff}

.hint{position:absolute;right:16px;top:26px;z-index:8;font-size:7px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.38);
  pointer-events:none;transition:opacity .4s}
.hint.h{opacity:0}
.adv{position:absolute;left:8px;bottom:7px;z-index:9;font-size:7px;font-weight:600;
  letter-spacing:1.3px;color:rgba(255,255,255,.26)}
@media(prefers-reduced-motion:reduce){.S .im,.g,.W b{transition:none}}
</style></head><body>

<div class="b" id="B">
  <div class="S" id="S"></div>
  <div class="fr"><b class="c1"></b><b class="c2"></b><b class="c3"></b><b class="c4"></b></div>
  <div class="lg"><b>Neon</b><i>Star Shooter</i></div>
  <div class="Wb"><div class="W"><b id="WN">HAIDES</b><span>20 levels &middot; 20 bosses</span></div></div>

  <div class="G" id="G"></div>
  <div class="st"><b>120</b><span>levels &middot; 120 bosses</span></div>
  <button class="cta" id="C">Play free</button>

  <div class="hint" id="H">Tap a planet</div>
  <div class="adv">ADVERTISEMENT</div>
</div>

     + " M12 7.4 9.4 5 M12 7.4 14.6 5 M12 16.6 9.4 19 M12 16.6 14.6 19" },
  { k: "tartaros", ad: "TARTAROS", renk: "#4D8CFF",
    s: "M12 12a2 2 0 0 1 2 2 4 4 0 0 1-4 4 6 6 0 0 1-6-6 8 8 0 0 1 8-8" }
];

var S = document.getElementById("S"), G = document.getElementById("G"),
    WN = document.getElementById("WN"), H = document.getElementById("H"),
    B = document.getElementById("B");

var kat = [], kart = [];
GEZEGEN.forEach(function (g, i) {
  var d = document.createElement("div");
  d.className = "im";
  d.style.backgroundImage = "url(" + SAHNE.dik[g.k] + ")";
  S.appendChild(d);
  kat.push(d);

  var c = document.createElement("div");
  c.className = "g";
  c.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="' + g.renk +
    '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' +
    g.s + '"/></svg><span>' + g.ad + '</span>';
  c.style.borderColor = "rgba(255,255,255,.13)";
  c.addEventListener("click", function (e) { e.stopPropagation(); H.className = "hint h"; sec(i); });
  G.appendChild(c);
  kart.push(c);
});

function sec(i) {
  for (var k = 0; k < GEZEGEN.length; k++) {
    kat[k].className = "im" + (k === i ? " on" : "");
    kart[k].className = "g" + (k === i ? " on" : "");
    kart[k].style.borderColor = k === i ? GEZEGEN[k].renk : "rgba(255,255,255,.13)";
  }
  var g = GEZEGEN[i];
  WN.textContent = g.ad;
  WN.style.color = g.renk;
  WN.style.textShadow = "0 0 18px " + g.renk + "cc";
}

B.addEventListener("click", function () { window.open(clickTag, "_blank"); });

sec(3);
</script>
