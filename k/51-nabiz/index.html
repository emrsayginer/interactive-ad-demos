<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>SANOVIA 300x250 &mdash; Find your rhythm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:300px;height:250px;overflow:hidden;background:#040F14;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;color:#EAFBFA;
  font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit;border:0;background:none}

.mesh{position:absolute;inset:0;
  background:
    radial-gradient(140% 90% at 8% -10%,#0B3D4A 0%,transparent 55%),
    radial-gradient(120% 90% at 105% 10%,#0E5C4C 0%,transparent 50%),
    radial-gradient(160% 120% at 50% 130%,#123A66 0%,transparent 60%),
    linear-gradient(180deg,#061821 0%,#03090C 100%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(-10deg)}}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>')}

.top{position:absolute;left:14px;top:10px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:8}
.lg{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(90deg,#B9FFEF,#7FD2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.adv{font-size:6px;font-weight:700;letter-spacing:1px;color:rgba(234,251,250,.35);text-transform:uppercase}

.stage{position:absolute;left:0;right:0;top:30px;bottom:40px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px}
.ringwrap{position:relative;width:118px;height:118px}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.orb{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#D6FFF3 0%,#5EEAD4 32%,#1E9E8C 62%,#0B4A46 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 0 26px 4px rgba(94,234,212,.55);
  display:flex;align-items:center;justify-content:center;pointer-events:auto;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.orb::after{content:"";width:30px;height:27px;filter:drop-shadow(0 0 2px rgba(0,0,0,.25));
  background:no-repeat center/contain url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29"><path fill="white" d="M16 29 C16 29 0 18.5 0 8.8 C0 3.5 4.2 0 8.7 0 C11.9 0 14.6 1.8 16 4.6 C17.4 1.8 20.1 0 23.3 0 C27.8 0 32 3.5 32 8.8 C32 18.5 16 29 16 29 Z"/></svg>')}
.orb.beat{transform:scale(1.14)}
.orb.hit{transform:scale(.86)}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#CFFCF3;left:50%;top:50%;
  pointer-events:none;animation:spk .5s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.msg{font-size:10.5px;font-weight:700;letter-spacing:.2px;color:rgba(234,251,250,.9);text-align:center;padding:0 20px}
@media(prefers-reduced-motion:reduce){.mesh{animation:none!important}.orb{transition:none!important}.spark{animation:none!important}}

.alt{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;background:linear-gradient(180deg,rgba(4,15,20,0),rgba(4,15,20,.78) 40%)}
.msj{font-size:9.5px;font-weight:600;color:rgba(234,251,250,.9)}
.cta{background:linear-gradient(135deg,#7FF3D8,#6EC8FF);color:#052024;font-size:9px;font-weight:800;
  border-radius:13px;padding:8px 13px;letter-spacing:.4px;text-transform:uppercase;pointer-events:auto;
  white-space:nowrap;box-shadow:0 2px 10px rgba(110,226,255,.35),0 0 0 1px rgba(255,255,255,.25) inset}
</style></head><body>
<div id="R">
<div class="mesh"></div>
<div class="grain"></div>

<div class="top"><div class="lg">sanovia</div><div class="adv">Advertisement</div></div>

<div class="stage" id="STAGE" data-kontrol="1">
  <div class="ringwrap">
    <svg viewBox="0 0 118 118">
      <circle cx="59" cy="59" r="52" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="5"></circle>
      <circle id="RING" cx="59" cy="59" r="52" fill="none" stroke="url(#g1)" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
        style="transition:stroke-dashoffset .35s ease"></circle>
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#B9FFEF"></stop><stop offset="1" stop-color="#6EC8FF"></stop>
      </linearGradient></defs>
    </svg>
    <div class="orb" id="ORB"></div>
  </div>
  <div class="msg" id="MSG">Tap in time with your heartbeat</div>
</div>

<div class="alt">
  <div class="msj">Your vitals, in one calm view</div>
  <button class="cta" data-cta="1">Book free check-up</button>
</div>
</div>
<script>
var clickTag = "../../landing.html?b=sanovia";

var STAGE = document.getElementById("STAGE"), ORB = document.getElementById("ORB"),
    RING = document.getElementById("RING"), MSG = document.getElementById("MSG");
var BEAT = 860, TOL = 220, TARGET = 5, CIRC = 326.7;

var hits = 0, beatStart = performance.now(), done = false, autoOn = true, beatTimer = null, autoT = null;

function nearestBeatDelta(now) {
  var since = now - beatStart;
  var idx = Math.round(since / BEAT);
  return since - idx * BEAT;
}
function pulseTick() {
  if (done) return;
  ORB.classList.add("beat");
  setTimeout(function () { ORB.classList.remove("beat"); }, 160);
  beatTimer = setTimeout(pulseTick, BEAT);
}
function spark() {
  for (var i = 0; i < 6; i++) {
    var s = document.createElement("div");
    s.className = "spark";
    var a = (i / 6) * Math.PI * 2;
    s.style.setProperty("--dx", (Math.cos(a) * 46) + "px");
    s.style.setProperty("--dy", (Math.sin(a) * 46) + "px");
    STAGE.querySelector(".ringwrap").appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 520); })(s);
  }
}
function registerHit() {
  hits++;
  RING.style.strokeDashoffset = (CIRC - (hits / TARGET) * CIRC).toString();
  ORB.classList.add("hit");
  setTimeout(function () { ORB.classList.remove("hit"); }, 140);
  spark();
  if (hits >= TARGET) {
    done = true;
    clearTimeout(beatTimer);
    clearTimeout(autoT);
    MSG.textContent = "Perfectly in sync — book your free check-up";
  }
}
function tap() {
  if (done) return;
  clearTimeout(autoT);
  autoOn = false;
  var delta = Math.abs(nearestBeatDelta(performance.now()));
  if (delta <= TOL) {
    registerHit();
  } else {
    MSG.textContent = "Almost — wait for the glow";
  }
}
function scheduleAuto() {
  clearTimeout(autoT);
  var since = performance.now() - beatStart;
  var idx = Math.ceil(since / BEAT);
  var wait = idx * BEAT - since + 20;
  autoT = setTimeout(function () {
    if (!autoOn || done) return;
    registerHit();
    if (!done) scheduleAuto();
  }, wait);
}

ORB.addEventListener("pointerdown", function (e) { e.stopPropagation(); tap(); });
pulseTick();
scheduleAuto();

(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
