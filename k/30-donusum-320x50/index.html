<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=50">
<title>LEDGA 320x50 &mdash; Animated HTML5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
html,body{width:320px;height:50px;overflow:hidden;background:#101418;
  -webkit-font-smoothing:antialiased}
#R{position:relative;width:320px;height:50px;overflow:hidden;cursor:pointer;
  background:#101418;color:#F3F1EA;font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit}

.f1 h1,.fis,.kart,.li1,.li2,.li3,.f2 .sonuc,.f3 .lg,.f3 h2,.f3 .cta{opacity:0}
.f1 h1{transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.f1 h1.in{opacity:1;transform:none}
.f1 h1.out{opacity:0;transform:translateY(-10px);transition-duration:.35s}
.fis{transform:translateY(-30px) rotate(-4deg);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1)}
.fis.in{opacity:1;transform:none}
.fis.out{opacity:0;transform:translateY(60px) rotate(14deg);transition:opacity .5s,transform .6s ease-in}
.kart{transform:translateX(40px) rotate(6deg);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.kart.in{opacity:1;transform:none}
.kart.out{opacity:0;transform:translateX(-30px);transition-duration:.35s}
.li1,.li2,.li3{transform:translateX(-10px);transition:opacity .35s,transform .35s ease}
.li1.in,.li2.in,.li3.in{opacity:1;transform:none}
.li1.out,.li2.out,.li3.out{opacity:0}
.f2 .sonuc{transition:opacity .45s}
.f2 .sonuc.in{opacity:1}
.f2 .sonuc.out{opacity:0}
.f3 .lg{transform:scale(.9);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1)}
.f3 .lg.in{opacity:1;transform:none}
.f3 h2{transform:translateY(8px);transition:opacity .45s,transform .45s ease}
.f3 h2.in{opacity:1;transform:none}
.f3 .cta{transform:translateY(8px);transition:opacity .4s,transform .4s ease,background .2s}
.f3 .cta.in{opacity:1;transform:none;pointer-events:auto}

.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:2px;color:#F3F1EA}
.lg i{width:9px;height:9px;border-radius:3px;background:#2FBF71;display:block}

.cta{display:inline-block;background:#2FBF71;color:#101418;border:0;border-radius:3px;cursor:pointer;pointer-events:none;
  font:800 8px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.0px;text-transform:uppercase;padding:8px 11px;white-space:nowrap}
.cta:hover{background:#F3F1EA}

.f1,.f2,.f3{position:absolute;inset:0}
.f1 h1,.f3 h2{font-weight:800;letter-spacing:-.5px;line-height:1.05;color:#F3F1EA}
.sonuc{color:#2FBF71;font-weight:700}
.eb{position:absolute;font-size:8px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:#8C949C}

.f1 h1{position:absolute;left:12px;top:16px;font-size:15px}
.fis{display:none}
.kart{display:none}
.f2 .lis{position:absolute;left:12px;top:10px;display:flex;gap:10px}
.li{font-size:10px}
.f2 .sonuc{position:absolute;left:12px;top:29px;font-size:10px}
.f3 .lg{position:absolute;left:12px;top:19px}
.f3 h2{position:absolute;left:84px;top:14px;width:150px;font-size:10px;line-height:1.15;font-weight:600}
.f3 .cta{position:absolute;right:10px;top:12px}

.adv{position:absolute;left:12px;bottom:0px;
  font-size:5.5px;font-weight:600;letter-spacing:1.2px;color:#2A3138;
  pointer-events:none;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="R">

<div class="f1"><h1>Expense reports, retired.</h1></div>
<div class="f2"><div class="lis"><div class="li li1"><i></i>Cards</div><div class="li li2"><i></i>Receipts</div><div class="li li3"><i></i>Approvals</div></div><div class="sonuc">Close the month in two days.</div></div>
<div class="f3"><div class="lg"><i></i>LEDGA</div><h2>Every receipt matched, every approval logged.</h2><button class="cta" data-cta="1">Demo</button></div>
<div class="adv">Advertisement</div>
</div>
<script>
var clickTag = "https://example.com/ledga-demo";

var AKIS = [
  [0.1, ".f1 h1", "in"], [0.5, ".fis", "in"], [2.6, ".fis", "out"], [3.4, ".f1 h1", "out"],
  [4.4, ".kart", "in"], [5.2, ".li1", "in"], [5.9, ".li2", "in"], [6.6, ".li3", "in"], [7.6, ".f2 .sonuc", "in"],
  [9.6, ".f2 .sonuc", "out"], [9.6, ".li1", "out"], [9.6, ".li2", "out"], [9.6, ".li3", "out"], [9.8, ".kart", "out"],
  [10.5, ".f3 .lg", "in"], [11.0, ".f3 h2", "in"], [11.6, ".f3 .cta", "in"]
];
var SURE = 15, DONGU = 3;

var hepsi = [];
AKIS.forEach(function (a) { Array.prototype.forEach.call(document.querySelectorAll(a[1]), function (e) { if (hepsi.indexOf(e) < 0) hepsi.push(e); }); });
function sifirla() { hepsi.forEach(function (e) { e.classList.remove("in", "out"); }); }
function uygula(a) {
  Array.prototype.forEach.call(document.querySelectorAll(a[1]), function (e) {
    if (a[2] === "in") { e.classList.remove("out"); e.classList.add("in"); }
    else { e.classList.add("out"); }
  });
}
var azHareket = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var dongu = 0, bas = 0, i = 0, elle = false;
function sonKare() {
  sifirla();
  AKIS.forEach(function (a) { if (a[0] >= 9.6) uygula(a); });
}
function adim(z) {
  if (elle) return;   /* ayarla() devraldi: canli dongu olaylari ustune yazmasin */
  if (!bas) bas = z;
  var t = (z - bas) / 1000;
  while (i < AKIS.length && AKIS[i][0] <= t) { uygula(AKIS[i]); i++; }
  if (t >= SURE) {
    dongu++;
    if (dongu >= DONGU) { sonKare(); return; }   /* uc donguden sonra son karede dur */
    sifirla(); bas = z; i = 0;
  }
  requestAnimationFrame(adim);
}
/* Kayit ve test icin: zaman cizelgesini t saniyesine DOGRUDAN kurar.
   tools/kayit.html kareleri elle surer; gercek zaman kullanmaz. */
function ayarla(t) { elle = true; sifirla(); AKIS.forEach(function (a) { if (a[0] <= t) uygula(a); }); }
if (azHareket) sonKare(); else requestAnimationFrame(adim);

/* Kok tiklamasi acilis sayfasina gider; kontroller ve surukleme haric. */
(function () {
  var R = document.getElementById("R"), x0 = 0, y0 = 0, hareket = false;
  R.addEventListener("pointerdown", function (e) { x0 = e.clientX; y0 = e.clientY; hareket = false; });
  R.addEventListener("pointermove", function (e) {
    if (e.buttons && (Math.abs(e.clientX - x0) > 4 || Math.abs(e.clientY - y0) > 4)) hareket = true;
  });
  R.addEventListener("click", function (e) {
    if (hareket) { hareket = false; return; }
    if (e.target.closest && e.target.closest("[data-kontrol]")) return;
    window.open(clickTag, "_blank");
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cta]"), function (b) {
    b.addEventListener("click", function (e) { e.stopPropagation(); window.open(clickTag, "_blank"); });
  });
})();
</script></body></html>
